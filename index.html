<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="2026 福岡 5天4夜親子慢活之旅 行程助手" />
  <style>
:root{
  --bg:#f5f7fb; --card:#fff; --text:#1d2a3b; --muted:#6f7a8a; --line:#e7ebf2;
  --blue:#2f6fed; --blue2:#5f8df6; --pink:#ef6e9c; --green:#33a672; --orange:#f49a3f; --purple:#7f65d9;
  --danger:#d94b4b; --shadow:0 10px 30px rgba(41,55,78,.08); --radius:20px;
}
*{box-sizing:border-box} html{scroll-behavior:smooth} body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:var(--text)}
button,a{font:inherit} a{text-decoration:none;color:inherit}
.app-shell{max-width:820px;margin:0 auto;padding-bottom:84px}.hero{background:linear-gradient(145deg,#2f6fed,#6e98f7);color:#fff;padding:28px 20px 22px;border-radius:0 0 28px 28px;box-shadow:var(--shadow)}
.hero-top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.eyebrow{font-size:11px;letter-spacing:1.5px;opacity:.8;font-weight:700}.hero h1{margin:8px 0 8px;font-size:30px;line-height:1.18}.hero-sub{margin:0;opacity:.92}.hero-icon{font-size:54px}
.status-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}.status-card{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:10px;text-align:center;display:flex;flex-direction:column;gap:2px}.status-card span{font-size:20px}.status-card b{font-size:13px}.status-card small{font-size:10px;opacity:.85}.countdown{margin-top:12px;font-size:13px;font-weight:700;background:rgba(255,255,255,.13);padding:10px 12px;border-radius:12px}
.day-tabs{position:sticky;top:0;z-index:10;display:flex;gap:7px;padding:10px 12px;background:rgba(245,247,251,.92);backdrop-filter:blur(12px);overflow:auto}.tab{border:0;background:#fff;color:var(--muted);padding:10px 13px;border-radius:999px;box-shadow:0 3px 12px rgba(30,45,68,.06);font-weight:800;white-space:nowrap}.tab.active{background:var(--blue);color:#fff}
#content{padding:14px}.section{margin-bottom:18px}.section-title{display:flex;align-items:center;gap:8px;font-size:17px;margin:4px 2px 10px}.section-title .dot{width:8px;height:8px;border-radius:50%;background:var(--blue)}
.card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);border:1px solid #eef1f6;margin-bottom:12px}.card h2,.card h3,.card p{margin-top:0}.muted{color:var(--muted);font-size:13px}.pill{display:inline-flex;align-items:center;gap:5px;padding:6px 9px;border-radius:999px;background:#edf3ff;color:#2f6fed;font-size:12px;font-weight:800}.pill.warn{background:#fff2e7;color:#bc651a}.pill.green{background:#eaf8f1;color:#28845b}.pill.red{background:#fdecec;color:#b93c3c}
.quick-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.quick{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow)}.quick .emoji{font-size:27px}.quick b{display:block;margin-top:5px;font-size:14px}.quick small{color:var(--muted)}
.day-header{border-radius:22px;padding:18px;color:#fff;margin-bottom:14px;box-shadow:var(--shadow)}.day-header h2{margin:0 0 4px;font-size:23px}.day-header p{margin:0;opacity:.9}.d1{background:linear-gradient(135deg,var(--blue),#6f9cff)}.d2{background:linear-gradient(135deg,var(--pink),#f49ab9)}.d3{background:linear-gradient(135deg,var(--green),#65c79b)}.d4{background:linear-gradient(135deg,var(--orange),#f7bb6d)}.d5{background:linear-gradient(135deg,var(--purple),#a48cec)}
.timeline{position:relative;padding-left:20px}.timeline:before{content:"";position:absolute;left:6px;top:6px;bottom:8px;width:2px;background:#dbe2ee}.event{position:relative;padding:0 0 16px 14px}.event:before{content:"";position:absolute;left:-18px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 4px #edf3ff}.event-time{font-size:12px;color:var(--muted);font-weight:900}.event-title{font-size:16px;font-weight:900;margin:3px 0}.event-desc{font-size:13px;line-height:1.55;color:#4d5867}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;border:0;border-radius:12px;padding:9px 11px;font-size:12px;font-weight:900;background:#eef3ff;color:#2f6fed}.btn.primary{background:var(--blue);color:#fff}.btn.green{background:#eaf8f1;color:#28845b}.btn.dark{background:#26364d;color:white}.btn.soft{background:#f2f3f6;color:#475569}
.notice{border-left:4px solid var(--blue);background:#f7f9ff;border-radius:12px;padding:12px 13px;font-size:13px;line-height:1.55}.notice.warn{border-color:#f49a3f;background:#fff8ef}.notice.danger{border-color:#d94b4b;background:#fff2f2}
.checklist label{display:flex;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}.checklist label:last-child{border:0}.checklist input{width:20px;height:20px;accent-color:var(--blue)}
.route{display:flex;align-items:center;gap:8px;overflow:auto;padding:3px 0}.route .stop{flex:0 0 auto;border-radius:14px;background:#f7f9fc;padding:10px 12px;text-align:center;font-size:12px;font-weight:800}.route .arrow{color:#9aa4b2}
.weather-toggle{display:flex;gap:8px;margin-bottom:12px}.weather-toggle button{flex:1;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px;font-weight:900}.weather-toggle button.active{background:#26364d;color:#fff}.hidden{display:none!important}
.kpi-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.kpi{background:#f7f9fc;border-radius:14px;text-align:center;padding:12px 6px}.kpi b{display:block;font-size:18px}.kpi small{color:var(--muted)}
.shop-list{display:grid;gap:8px}.shop{display:flex;justify-content:space-between;align-items:center;background:#fafbfc;border:1px solid var(--line);padding:11px;border-radius:13px}.shop b{font-size:14px}.shop span{font-size:12px;color:var(--muted)}
footer{text-align:center;color:#8b95a5;font-size:12px;padding:20px 12px}
@media(min-width:700px){#content{padding:18px}.quick-grid{grid-template-columns:repeat(4,1fr)}.hero{padding:32px}.hero h1{font-size:36px}}

  </style>
  <title>福岡親子慢活之旅</title>
</head>
<body>
  <div class="app-shell">
    <header class="hero">
      <div class="hero-top">
        <div>
          <div class="eyebrow">FUKUOKA FAMILY TRIP</div>
          <h1>福岡 5天4夜<br>親子慢活之旅</h1>
          <p class="hero-sub">2026/09/09（三）— 09/13（日）</p>
        </div>
        <div class="hero-icon">🇯🇵</div>
      </div>
      <div class="status-row">
        <div class="status-card"><span>✈️</span><b>BR106</b><small>08:00 → 11:20</small></div>
        <div class="status-card"><span>🏨</span><b>Quintessa</b><small>Tenjin Minami</small></div>
        <div class="status-card"><span>✈️</span><b>BR105</b><small>12:20 → 13:45</small></div>
      </div>
      <div id="countdown" class="countdown"></div>
    </header>

    <nav class="day-tabs" aria-label="行程日期">
      <button data-day="home" class="tab active">首頁</button>
      <button data-day="1" class="tab">D1</button>
      <button data-day="2" class="tab">D2</button>
      <button data-day="3" class="tab">D3</button>
      <button data-day="4" class="tab">D4</button>
      <button data-day="5" class="tab">D5</button>
    </nav>

    <main id="content"></main>

    <footer>
      慢慢走・好好吃・好好休息，就是最棒的親子旅行 ✨
    </footer>
  </div>
  <script>
const trip = {
  hotel: {name:'Quintessa Hotel Fukuoka Tenjin Minami', jp:'クインテッサホテル福岡天神南', maps:'https://www.google.com/maps/search/?api=1&query=Quintessa+Hotel+Fukuoka+Tenjin+Minami'},
  days: {
    1:{date:'09/09（三）',theme:'抵達福岡・LaLaport・喜水丸',class:'d1',events:[
      ['11:20','✈️ 抵達福岡機場','國際線抵達。通關＋行李預留約 60–90 分鐘。','https://www.google.com/maps/search/?api=1&query=Fukuoka+Airport+International+Terminal'],
      ['12:30 前後','🧳 DELIBAG 交寄大件行李','9/6–9/7 前先完成預約／付款。尿布、奶、文件、藥品、換洗衣物留隨身。',null],
      ['12:45–13:10','🚕 計程車前往 LaLaport','機場 Taxi Stand 有車就直接搭；否則 Uber。', 'https://www.google.com/maps/search/?api=1&query=LaLaport+Fukuoka'],
      ['13:00–17:20','🛍️ LaLaport Fukuoka','3F 午餐、阿卡將、推車午睡、1F 鋼彈。16:30 起可依體力提早撤。','https://www.google.com/maps/search/?api=1&query=LaLaport+Fukuoka'],
      ['17:30','🚕 前往博多站筑紫口','建議 17:20 開始收東西，避免晚高峰與找餐廳壓力。','https://www.google.com/maps/search/?api=1&query=Hakata+Station+Chikushi+Exit'],
      ['18:30','🍚 晚餐｜博多の名物料理 喜水丸','已預約。孕婦以烤魚、煮魚、天婦羅等熟食為主。','https://www.google.com/maps/search/?api=1&query=博多の名物料理+喜水丸+博多デイトスアネックス店'],
      ['20:00–20:15','🚇 博多 → 藥院 → 飯店入住','七隈線約 3 個區間；藥院站至飯店步行約 2–3 分鐘。',null]
    ]},
    2:{date:'09/10（四）',theme:'麵包超人・櫛田神社・燒肉上',class:'d2',events:[
      ['09:00–09:45','🍳 飯店早餐','不用趕，讓寶寶先吃飽再出發。',null],
      ['10:00','🚕 前往博多 Riverain','飯店門口叫 Uber/GO。','https://www.google.com/maps/search/?api=1&query=Hakata+Riverain'],
      ['10:15–12:30','👶 福岡麵包超人兒童博物館','館內不能推嬰兒車，要停 5F；爸爸主力陪玩/抱，媽媽不要長時間抱小孩。','https://www.google.com/maps/search/?api=1&query=Fukuoka+Anpanman+Children%27s+Museum'],
      ['12:30–13:30','🍴 館內午餐','吃完先判斷寶寶睡意與媽媽體力。',null],
      ['13:30–14:15','⛩️ 川端商店街 → 櫛田神社（Optional）','體力好才去；累了直接 Taxi 回飯店。','https://www.google.com/maps/search/?api=1&query=Kushida+Shrine+Fukuoka'],
      ['14:30–17:45','😴 飯店深度休息','寶寶完整午睡；媽媽抬腿休息。這段優先級高於任何 Bonus 景點。',null],
      ['18:45','🥩 晚餐｜燒肉 上','已預約。肉類全熟、生熟夾分開。餐廳在 2F，出發前再確認嬰兒車/電梯動線。','https://www.google.com/maps/search/?api=1&query=ヤキニク+上+福岡']
    ]},
    3:{date:'09/11（五）',theme:'Marine World・海豚秀・藥院晚餐',class:'d3',events:[
      ['09:20–09:30','🚕 飯店出發','建議提早叫車；這段可能 30–45 分鐘以上，視交通而定。','https://www.google.com/maps/search/?api=1&query=Marine+World+Uminonakamichi'],
      ['10:10','🐠 Marine World 入館','先看外洋大水槽、海豹等。2026 已無海獺展示，行程不要再排海獺餵食。','https://www.google.com/maps/search/?api=1&query=Marine+World+Uminonakamichi'],
      ['11:00','🐬 海豚・海獅秀','優先看 11:00 這場，避免為下午場延後午睡。',null],
      ['11:35–12:40','🍴 Restaurant Reilly','水下景觀用餐；孕婦選熟食。',null],
      ['12:40–13:20','🐟 自由看展／企鵝／大水槽','寶寶若已睏，可直接提前離館。',null],
      ['13:20–13:40','🚕 返回飯店','不追求把館內全部看完。',trip.hotel.maps],
      ['14:30–17:30','😴 飯店休息','Day 3 是體力最高的一天，下午不要再塞景點。',null],
      ['18:00','🍲 白金／藥院周邊晚餐','水炊鍋、烏龍麵或熟食定食；視體力彈性延後至 18:30。','https://www.google.com/maps/search/?api=1&query=Yakuin+Fukuoka+restaurants']
    ]},
    4:{date:'09/12（六）',theme:'大濠公園・敘敘苑・岩田屋',class:'d4',events:[
      ['08:30–09:20','🍳 早餐＋準備','確認當日降雨與體感溫度。',null],
      ['09:30','🚕 前往大濠公園','戶外只安排短時間。','https://www.google.com/maps/search/?api=1&query=Ohori+Park'],
      ['09:45–10:30','🌳 大濠公園慢散步','看湖、拍照即可，不把環湖一圈當目標。','https://www.google.com/maps/search/?api=1&query=Ohori+Park'],
      ['10:30–11:30','🎨 福岡市美術館／咖啡休息','進室內吹冷氣、坐著休息。','https://www.google.com/maps/search/?api=1&query=Fukuoka+Art+Museum'],
      ['12:30–14:00','🥩 敘敘苑｜岩田屋新館 7F','已預約。肉品全熟。','https://www.google.com/maps/search/?api=1&query=叙々苑+福岡岩田屋店'],
      ['14:00–15:30','👶 岩田屋本館 6F Baby / Kids','Familiar、MIKI HOUSE、童鞋、育嬰室。','https://www.google.com/maps/search/?api=1&query=岩田屋本店'],
      ['15:30 後','🛍️ 體力好才順逛','UNIQLO / GU / Bic Camera / 天神地下街；不排固定時段。',null],
      ['15:45–17:30','😴 回飯店休息','如果購物狀況很好，可延後；媽媽累就直接回飯店。',trip.hotel.maps],
      ['18:00','🍜 飯店周邊清淡晚餐','早點回房整理行李。','https://www.google.com/maps/search/?api=1&query=Yakuin+Fukuoka+restaurants']
    ]},
    5:{date:'09/13（日）',theme:'退房・福岡機場・回台',class:'d5',events:[
      ['08:00–09:00','🍳 早餐＋最後打包','MEDIF、診斷證明、媽媽手冊、護照全部留隨身。',null],
      ['09:15','🧳 退房','檢查房間、充電器、寶寶用品。',null],
      ['09:30','🚕 前往福岡機場國際線','有行李＋推車，建議叫較大車型。','https://www.google.com/maps/search/?api=1&query=Fukuoka+Airport+International+Terminal'],
      ['09:55 左右','✈️ 抵達機場','先換尿布／整理推車／找長榮櫃台。',null],
      ['10:20 左右','🧾 長榮人工櫃台報到','BR105 12:20 起飛；孕婦＋2歲以下幼兒以人工櫃台辦理較實際。主動詢問 Priority Lane 與推車 Gate Check。',null],
      ['11:15–11:50','🛍️ 免稅店／最後補貨','提領線上預約商品、育嬰室整理。',null],
      ['11:50','🛫 登機門集合','孕婦＋幼兒可詢問優先登機。',null],
      ['12:20–13:45','✈️ BR105 福岡 → 桃園','平安返台。',null]
    ]}
  }
};

const $ = s => document.querySelector(s);
const content = $('#content');

function mapsButton(url){ return url ? `<a class="btn primary" target="_blank" rel="noopener" href="${url}">📍 Google Maps</a>` : '' }
function taxiButtons(){ return `<a class="btn dark" target="_blank" rel="noopener" href="https://m.uber.com/">🚕 Uber</a><a class="btn green" target="_blank" rel="noopener" href="https://go.goinc.jp/">🚖 GO</a>` }
function renderEvents(events){
  return `<div class="card"><div class="timeline">${events.map(e=>`<div class="event"><div class="event-time">${e[0]}</div><div class="event-title">${e[1]}</div><div class="event-desc">${e[2]}</div><div class="actions">${mapsButton(e[3])}${e[1].includes('🚕')?taxiButtons():''}</div></div>`).join('')}</div></div>`
}

function home(){
  content.innerHTML = `
  <section class="section">
    <div class="section-title"><span class="dot"></span><b>這趟旅行的執行原則</b></div>
    <div class="card">
      <div class="kpi-row"><div class="kpi"><b>1</b><small>每天 1 個主任務</small></div><div class="kpi"><b>2–3h</b><small>午後休息</small></div><div class="kpi"><b>Taxi</b><small>減少步行</small></div></div>
      <p class="muted" style="margin-top:12px">景點可以少看，休息不能少。任何 Bonus 行程都以媽媽體力與寶寶午睡為優先。</p>
    </div>
  </section>
  <section class="section"><div class="section-title"><span class="dot"></span><b>快速入口</b></div>
    <div class="quick-grid">
      <a class="quick" href="${trip.hotel.maps}" target="_blank"><div class="emoji">🏨</div><b>回飯店</b><small>Quintessa</small></a>
      <a class="quick" href="https://m.uber.com/" target="_blank"><div class="emoji">🚕</div><b>叫 Uber</b><small>主要叫車</small></a>
      <a class="quick" href="https://go.goinc.jp/" target="_blank"><div class="emoji">🚖</div><b>開 GO</b><small>備用叫車</small></a>
      <a class="quick" href="https://www.google.com/maps/search/?api=1&query=Fukuoka+Airport+International+Terminal" target="_blank"><div class="emoji">✈️</div><b>福岡機場</b><small>國際線</small></a>
    </div>
  </section>
  <section class="section"><div class="section-title"><span class="dot"></span><b>出發前重要事項</b></div>
    <div class="card">
      <span class="pill red">🤰 MEDIF</span>
      <h3 style="margin:10px 0 8px">9/6（日）產檢＋請醫師開立文件</h3>
      <div class="notice danger">9/6 取得後當天就依長榮指示提交，9/7 再確認 BR106 與 BR105 兩個航段都已註記／核准。MEDIF、診斷證明、媽媽手冊全部放隨身，不托運。</div>
    </div>
    <div class="card">
      <span class="pill">🧳 DELIBAG</span>
      <p style="margin:10px 0 0">建議 9/6–9/7 前完成機場→飯店行李配送預約與付款。當天只留下寶寶用品、文件、藥品與換洗衣物。</p>
    </div>
  </section>
  <section class="section"><div class="section-title"><span class="dot"></span><b>每日出門 Checklist</b></div>
    <div class="card checklist" id="checklist">
      ${['推車','尿布 × 5–6','濕紙巾','寶寶換洗衣物','水／水杯','奶／點心','帽子＋防曬','常用藥品','MEDIF／媽媽手冊（搭機日）'].map((x,i)=>`<label><input type="checkbox" data-key="c${i}"><span>${x}</span></label>`).join('')}
    </div>
  </section>
  <section class="section"><div class="section-title"><span class="dot"></span><b>緊急資訊</b></div>
    <div class="card"><div class="shop-list">
      <div class="shop"><div><b>🚑 119</b><span>救護車／消防</span></div><a class="btn" href="tel:119">撥打</a></div>
      <div class="shop"><div><b>👮 110</b><span>警察</span></div><a class="btn" href="tel:110">撥打</a></div>
      <div class="shop"><div><b>☎️ JNTO 旅客熱線</b><span>050-3816-2787</span></div><a class="btn" href="tel:+815038162787">撥打</a></div>
    </div></div>
  </section>`;
  restoreChecklist();
}

function dayPage(n){
  const d = trip.days[n];
  let extra = '';
  if(n===4){
    extra = `<section class="section"><div class="section-title"><span class="dot"></span><b>Day 4 天氣模式</b></div>
      <div class="weather-toggle"><button id="sunBtn" class="active">☀️ 晴天</button><button id="rainBtn">🌧️ 雨天</button></div>
      <div id="sunPlan" class="card"><b>晴天版</b><div class="route" style="margin-top:10px"><div class="stop">🌳 大濠 45m</div><div class="arrow">→</div><div class="stop">🎨 美術館</div><div class="arrow">→</div><div class="stop">🥩 敘敘苑</div><div class="arrow">→</div><div class="stop">👶 岩田屋</div></div></div>
      <div id="rainPlan" class="card hidden"><b>雨天版</b><p class="muted" style="margin-top:8px">不硬去大濠。TeamLab 不是優先雨備；直接走舒適室內線。</p><div class="route"><div class="stop">🚕 天神</div><div class="arrow">→</div><div class="stop">☕ 百貨/咖啡</div><div class="arrow">→</div><div class="stop">🥩 敘敘苑</div><div class="arrow">→</div><div class="stop">👶 岩田屋</div></div></div>
    </section>
    <section class="section"><div class="section-title"><span class="dot"></span><b>🛍️ 體力好再順逛</b></div><div class="card shop-list">
      ${[['UNIQLO 天神','Baby / Kids 也可看','https://www.google.com/maps/search/?api=1&query=UNIQLO+Tenjin+Fukuoka'],['GU Mina Tenjin','同區順路','https://www.google.com/maps/search/?api=1&query=GU+Mina+Tenjin'],['Bic Camera 天神','3C / 美容家電 / 藥妝','https://www.google.com/maps/search/?api=1&query=Bic+Camera+Tenjin+Fukuoka'],['天神地下街','下雨也方便','https://www.google.com/maps/search/?api=1&query=Tenjin+Underground+Mall']].map(s=>`<div class="shop"><div><b>${s[0]}</b><span>${s[1]}</span></div><a class="btn" target="_blank" href="${s[2]}">導航</a></div>`).join('')}
    </div></section>`
  }
  content.innerHTML = `<div class="day-header ${d.class}"><h2>Day ${n}｜${d.date}</h2><p>${d.theme}</p></div>${renderEvents(d.events)}${extra}
  <section class="section"><div class="card notice warn"><b>今日原則：</b> ${n==1?'第一天不硬撐，LaLaport 16:30 後隨時可撤。':n==2?'麵包超人是唯一主任務，櫛田神社只是 Bonus。':n==3?'11:00 海豚秀＋午餐後可撤，不追完整館。':n==4?'大濠是 Bonus；敘敘苑＋岩田屋才是穩定主線。':'到機場最重要，免稅店有時間再逛。'}</div></section>`;
  if(n===4) bindWeatherToggle();
}

function bindWeatherToggle(){
  const s=$('#sunBtn'), r=$('#rainBtn'), sp=$('#sunPlan'), rp=$('#rainPlan');
  s.onclick=()=>{s.classList.add('active');r.classList.remove('active');sp.classList.remove('hidden');rp.classList.add('hidden')};
  r.onclick=()=>{r.classList.add('active');s.classList.remove('active');rp.classList.remove('hidden');sp.classList.add('hidden')};
}

function restoreChecklist(){
  document.querySelectorAll('#checklist input').forEach(el=>{
    el.checked = localStorage.getItem(el.dataset.key)==='1';
    el.onchange=()=>localStorage.setItem(el.dataset.key,el.checked?'1':'0');
  })
}

function setTab(day){
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.day===String(day)));
  day==='home'?home():dayPage(Number(day));
  window.scrollTo({top:0,behavior:'smooth'});
}

document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.day)));

function updateCountdown(){
  const now=new Date(); const start=new Date('2026-09-09T08:00:00+08:00'); const end=new Date('2026-09-13T13:45:00+08:00');
  let txt='';
  if(now<start){const d=Math.ceil((start-now)/86400000);txt=`距離出發約 ${d} 天｜9/6 產檢＋MEDIF`}
  else if(now>end){txt='旅程已完成，歡迎把這份行程頁留作旅行回憶 ✨'}
  else{txt='旅行進行中｜今天只完成一個主任務也很棒 👍'}
  $('#countdown').textContent=txt;
}

function autoOpenToday(){
  const now=new Date(); const m=now.getMonth()+1, d=now.getDate();
  const map={'9-9':1,'9-10':2,'9-11':3,'9-12':4,'9-13':5};
  const k=`${m}-${d}`; if(map[k]) setTab(map[k]); else home();
}

updateCountdown(); autoOpenToday();

  </script>
</body>
</html>
