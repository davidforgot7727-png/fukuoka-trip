function jpNow(){
  const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date());
  const o={};parts.forEach(p=>o[p.type]=p.value);return {date:`${o.year}-${o.month}-${o.day}`,min:Number(o.hour)*60+Number(o.minute)};
}

function eventStartMinutesJP(e){const st=firstTimeMinutes(e?.time||'');if(st===null)return null;return e?.tz==='TW'?st+60:st}

async function startItinerarySync(){if(itineraryUnsub||itineraryStarting)return;itineraryStarting=true;try{if(!await initFirebase()||!sharedDb)return;if(authUserOK())await seedItineraryIfNeeded();if(itineraryUnsub)return;itineraryUnsub=itineraryRef().onSnapshot(s=>{itineraryRowsCache=s.docs.map(d=>({_id:d.id,...d.data()}));itineraryLoaded=true;if(currentPage==='trip'){if(itineraryUIHasDraft()){itineraryRerenderPending=true;showNetworkToast('行程已同步；完成目前編輯後會更新畫面')}else rerenderTripPreservingPosition()}else if(currentPage==='home')home()},e=>{console.warn('itinerary sync',e);itineraryRowsCache=[];itineraryLoaded=false})}finally{itineraryStarting=false}}
function stopItinerarySync(){if(itineraryUnsub){try{itineraryUnsub()}catch(e){}itineraryUnsub=null}itineraryStarting=false;itineraryRowsCache=[];itineraryLoaded=false}
function itineraryEditorToolbarHTML(day,mode){if(!itineraryModifyMode||!authUserOK())return '';const dis=itineraryLoaded?'':'disabled';return `<div class="itinerary-editor-toolbar"><button class="it-btn primary" ${dis} onclick="openItineraryEditor(${day},'${mode}')">＋ 新增行程</button><button class="it-btn" ${dis} onclick="openAIBridge(${day},'${mode}','export')">🤖 AI 討論</button><button class="it-btn" ${dis} onclick="openAIBridge(${day},'${mode}','import')">📥 AI 匯回</button><button class="it-btn" ${dis} onclick="restoreLastItineraryBackup(${day},'${mode}')">↩ 最近備份</button><button class="it-btn" ${dis} onclick="restoreOriginalItinerary(${day},'${mode}')">♻️ 還原原始</button><span class="itinerary-sync-note ${itineraryLoaded?'live':''}">${itineraryLoaded?'● 行程已同步':'○ 正在建立／同步行程'}</span></div><div class="itinerary-backup-note">手動或 AI 匯回修改前都會先保存最近備份。AI「討論資料」與「匯回格式」分開匯出，方便先正常討論後再產生 JSON。</div>`}

const AI_ITINERARY_FORMAT='fukuoka-itinerary-ai-v1';
let aiImportPreviewData=null;
function aiBridgeHTML(day,mode){return `<div id="aiBridgeCard" class="ai-bridge-card hidden"><div class="ai-bridge-head"><div><b id="aiBridgeTitle">🤖 AI 行程工具</b><small>「討論資料」只讓 AI 了解目前行程、方便反覆討論；等你們討論定案後，再另外貼「匯回格式說明」請 AI 輸出可匯入 JSON。</small><span class="ai-format-chip">JSON · ${AI_ITINERARY_FORMAT}</span></div><button type="button" class="ai-bridge-close" onclick="closeAIBridge()">×</button></div><div class="ai-bridge-step"><div class="ai-bridge-step-title">① 匯出給 AI</div><div class="ai-export-kind"><b>💬 A. 討論用資料</b><small>只有目前行程與旅行原則，不要求 AI 回傳 JSON。最適合先問「這天合理嗎？」「怎麼調比較順？」「有沒有太趕？」並持續討論。</small><div class="ai-bridge-actions"><button type="button" class="ai-bridge-btn primary" onclick="exportAIDiscussion('day',${day},'${mode}')">💬 複製這一天資料</button><button type="button" class="ai-bridge-btn" onclick="exportAIDiscussion('all',${day},'${mode}')">🗓️ 複製完整 5 天資料</button><button type="button" class="ai-bridge-btn" onclick="downloadAIDiscussion('day',${day},'${mode}')">⬇️ 下載討論資料</button></div><div class="ai-discuss-help">建議：先把這份資料貼給 AI，再用一般對話方式慢慢調整。這一步不用顧 JSON 格式。</div></div><div class="ai-export-kind"><b>📐 B. 匯回格式說明</b><small>等討論完成後才貼給 AI。它會要求 AI 把「最後確認的方案」整理成網站可讀的 JSON。</small><div class="ai-bridge-actions"><button type="button" class="ai-bridge-btn primary" onclick="copyAIImportFormat(${day},'${mode}')">📋 複製匯回格式</button><button type="button" class="ai-bridge-btn" onclick="downloadAIImportFormat(${day},'${mode}')">⬇️ 下載格式說明</button></div><div class="ai-format-help">可以在同一個 ChatGPT 對話討論完後說：「好，就照這個版本。以下是網站匯回格式，請輸出。」再貼這份格式說明。</div></div><div class="ai-security-note">兩種匯出都不包含 Google 帳號、Firebase 金鑰、護照／Visit Japan／Drive 捷徑。</div></div><div class="ai-bridge-step"><div class="ai-bridge-step-title">② 把 AI 最後輸出的 JSON 貼回來</div><textarea id="aiImportText" class="ai-bridge-output" spellcheck="false" placeholder="討論定案後，把 AI 依『匯回格式說明』輸出的 JSON（或包含 JSON 程式碼區塊的整段回覆）貼在這裡…"></textarea><input id="aiImportFile" class="ai-import-file" type="file" accept=".json,.txt,application/json,text/plain" onchange="readAIImportFile(this)"><div class="ai-bridge-actions"><button type="button" class="ai-bridge-btn primary" onclick="previewAIImport()">🔎 預覽匯入</button><button type="button" class="ai-bridge-btn" onclick="clearAIImport()">清除</button></div><div id="aiImportPreview" class="ai-preview hidden"></div><div id="aiImportApply" class="ai-bridge-actions" style="margin-top:8px"></div></div></div>`}
function openAIBridge(day,mode,tab='export'){if(!itineraryModifyMode)return;if(!authUserOK())return signInGoogle();const card=document.getElementById('aiBridgeCard');if(!card){dayPage(day);return setTimeout(()=>openAIBridge(day,mode,tab),0)}card.classList.remove('hidden');document.getElementById('aiBridgeTitle').textContent=tab==='import'?'📥 AI 行程匯回':'🤖 AI 行程工具';requestAnimationFrame(()=>card.scrollIntoView({behavior:'smooth',block:'center'}));if(tab==='import')setTimeout(()=>document.getElementById('aiImportText')?.focus(),350)}
function closeAIBridge(){document.getElementById('aiBridgeCard')?.classList.add('hidden');aiImportPreviewData=null;flushPendingItineraryRender()}
function aiExportModes(scope,day,mode){if(scope==='day')return [{day:Number(day),mode:mode||itineraryModeForDay(day)}];return [{day:1,mode:'sun'},{day:2,mode:'sun'},{day:3,mode:'sun'},{day:4,mode:'sun'},{day:4,mode:'rain'},{day:5,mode:'sun'}]}
function aiExportPackage(scope='day',day=selectedTripDay,mode=itineraryModeForDay(day)){const groups=aiExportModes(scope,day,mode).map(g=>{const d=trip.days[g.day],items=(cachedItineraryEvents(g.day,g.mode)||defaultEventsForDay(g.day,g.mode)).map((x,i)=>{const y=plainItineraryItem(x);delete y.day;delete y.mode;y.order=(i+1)*100;return y});return {day:g.day,mode:g.mode,date:d?.date||'',theme:g.day===4&&g.mode==='rain'?'雨天室內・敘敘苑・岩田屋':d?.theme||'',rule:dayRule(g.day),items}});return {format:AI_ITINERARY_FORMAT,trip:{name:'我們與珵的大冒險',dates:'2026-09-09~2026-09-13',notes:['以原本已確定的航班、預約與固定時間為硬限制','不要刪除必要的交通、休息、安全提醒','保留 Google Maps 與圖片網址，除非該項目已被移除','Day 1 的 TW 表示台灣時間，JP 表示日本時間','Day 4 sun / rain 是兩套獨立行程']},days:groups}}
function discussionCategoryLabel(v){return ({main:'主任務',transport:'交通',meal:'用餐',rest:'休息',bonus:'Bonus',other:'其他'})[v]||'其他'}
function aiDiscussionText(scope='day',day=selectedTripDay,mode=itineraryModeForDay(day)){const pkg=aiExportPackage(scope,day,mode);const sections=pkg.days.map(g=>{const modeText=g.day===4?(g.mode==='rain'?'｜雨天版':'｜晴天版'):'';const rows=g.items.map((x,i)=>{const extras=[x.location?`地點：${x.location}`:'',`類型：${discussionCategoryLabel(x.category)}`,x.map?`地圖：${x.map}`:''].filter(Boolean).join('｜');return `${i+1}. ${x.time} [${x.tz}] ${x.title}\n   ${extras}${x.desc?`\n   說明：${x.desc}`:''}`}).join('\n');return `## Day ${g.day}${modeText}｜${g.date}\n主題：${g.theme}\n原則：${g.rule}\n\n${rows}`}).join('\n\n');return `我想跟你討論這趟福岡親子旅行的行程。下面是目前網站裡的行程資料。\n\n這一階段請先把自己當成旅遊規劃顧問，跟我正常討論即可，**不要急著輸出 JSON，也不用遵守網站匯入格式**。你可以分析時間是否合理、交通是否順、哪裡太趕、哪裡值得刪減，也可以提出替代方案並問我問題。我們會先透過對話把行程討論到定案。\n\n討論時請遵守這些前提：\n- 已確定的航班、已預約餐廳時間、明確標示的硬性時間不要任意改動。\n- 這是親子慢活旅行，要保留休息與緩衝，不追求塞滿景點。\n- Day 1 同時有台灣時間 TW 與日本時間 JP，請不要混淆時差。\n- Day 4 有晴天 sun 與雨天 rain 兩套獨立行程。\n- 不要自行假設未提供的訂位、營業保證或交通保證。\n- 如果建議改動，請清楚說明理由與可能影響。\n\n# 目前行程\n\n${sections}\n\n先從行程合理性與你認為最值得調整的地方開始跟我討論；暫時不要輸出網站匯入 JSON。`}
function aiImportFormatText(day=selectedTripDay,mode=itineraryModeForDay(day)){const modeHint=Number(day)===4?(mode==='rain'?'Day 4 雨天版':'Day 4 晴天版'):`Day ${day}`;return `我們前面已經完成行程討論。現在請依照**我們最後確認的版本**，輸出可匯回我的福岡行程網站的 JSON。\n\n請注意：\n1. 現在不要再重新規劃，也不要把較早討論但後來否決的方案放回來；以我們最後確認的內容為準。\n2. 只輸出這次真正需要更新的 day / mode。若我們只修改 ${modeHint}，days 陣列就只放該日／模式；不要為了湊完整 5 天而重寫其他沒變的行程。\n3. 若我們確實討論並修改了多天，才把那些天都放進 days。\n4. 最外層 format 必須是 "${AI_ITINERARY_FORMAT}"。\n5. day 只能是 1~5；mode 只能是 "sun" 或 "rain"。Day 1/2/3/5 使用 "sun"；Day 4 晴天用 "sun"、雨天用 "rain"。\n6. 每個 items 項目只能使用：time, tz, title, location, category, desc, map, img, tag, order。\n7. tz 只能是 "TW" 或 "JP"。\n8. category 只能是 "main", "transport", "meal", "rest", "bonus", "other"。\n9. order 依實際順序填 100, 200, 300...。\n10. map / img / tag 若原本資料有而且行程仍是同一項目，請保留；不知道的新網址不要亂編，沒有就填空字串。\n11. time 與 title 不可留空。\n12. 不要在 JSON 裡寫註解。\n13. 請把完整 JSON 放在一個 \`\`\`json 程式碼區塊中；JSON 前可以有一句很短的說明，但不要在 JSON 後再追加另一份版本。\n\n格式範例（內容只是示意，不代表實際行程）：\n\`\`\`json\n{\n  "format": "${AI_ITINERARY_FORMAT}",\n  "days": [\n    {\n      "day": ${Number(day)||1},\n      "mode": "${Number(day)===4?(mode==='rain'?'rain':'sun'):'sun'}",\n      "items": [\n        {\n          "time": "10:00–11:00",\n          "tz": "JP",\n          "title": "範例行程",\n          "location": "範例地點",\n          "category": "main",\n          "desc": "範例說明",\n          "map": "",\n          "img": "",\n          "tag": "",\n          "order": 100\n        }\n      ]\n    }\n  ]\n}\n\`\`\`\n\n現在請根據我們前面已經討論定案的內容，輸出最終 JSON。`}
async function copyTextCompat(text,successMsg='✓ 已複製，可直接貼到 ChatGPT'){try{await navigator.clipboard.writeText(text);showNetworkToast(successMsg);return true}catch(e){const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(_){}ta.remove();if(ok)showNetworkToast(successMsg);return ok}}
async function exportAIDiscussion(scope,day,mode){if(!itineraryLoaded&&await ensureFirebase())await seedItineraryIfNeeded();const text=aiDiscussionText(scope,day,mode);const ok=await copyTextCompat(text,'✓ 討論資料已複製');if(!ok)downloadTextFile(`fukuoka-ai-discussion-${scope==='all'?'all':`day${day}-${mode}`}.txt`,text)}
async function copyAIImportFormat(day,mode){const text=aiImportFormatText(day,mode);const ok=await copyTextCompat(text,'✓ 匯回格式已複製');if(!ok)downloadAIImportFormat(day,mode)}
function downloadTextFile(filename,text,type='text/plain'){const blob=new Blob([text],{type:`${type};charset=utf-8`}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function downloadAIDiscussion(scope,day,mode){downloadTextFile(`fukuoka-ai-discussion-${scope==='all'?'all':`day${day}-${mode}`}.txt`,aiDiscussionText(scope,day,mode))}
function downloadAIImportFormat(day,mode){downloadTextFile(`fukuoka-ai-import-format-v1.txt`,aiImportFormatText(day,mode))}
function clearAIImport(){const t=document.getElementById('aiImportText'),p=document.getElementById('aiImportPreview'),a=document.getElementById('aiImportApply'),f=document.getElementById('aiImportFile');if(t)t.value='';if(f)f.value='';if(p){p.className='ai-preview hidden';p.innerHTML=''}if(a)a.innerHTML='';aiImportPreviewData=null}
function readAIImportFile(input){const file=input?.files?.[0];if(!file)return;const r=new FileReader();r.onload=()=>{const t=document.getElementById('aiImportText');if(t)t.value=String(r.result||'');previewAIImport()};r.onerror=()=>alert('讀取檔案失敗');r.readAsText(file)}
function extractAIJSON(raw){const s=String(raw||'').trim();if(!s)throw new Error('尚未貼入 AI 回覆');const tries=[s];const fenced=[...s.matchAll(/```(?:json)?\s*([\s\S]*?)```/gi)].map(m=>m[1].trim());tries.push(...fenced);const first=s.indexOf('{'),last=s.lastIndexOf('}');if(first>=0&&last>first)tries.push(s.slice(first,last+1));for(const x of tries){try{return JSON.parse(x)}catch(e){}}throw new Error('找不到可解析的 JSON。請確認 AI 回覆包含完整 JSON。')}
function safeAIURL(v){const x=String(v||'').trim();if(!x)return '';try{const u=new URL(x);return (u.protocol==='https:'||u.protocol==='http:')?x:''}catch(e){return ''}}
function normalizeAIItem(raw,index){const allowed=new Set(['main','transport','meal','rest','bonus','other']),tz=String(raw?.tz||'JP').toUpperCase()==='TW'?'TW':'JP',category=allowed.has(raw?.category)?raw.category:'other';const title=String(raw?.title||'').trim(),time=String(raw?.time||'').trim();if(!title)throw new Error(`第 ${index+1} 筆缺少 title`);if(!time)throw new Error(`「${title}」缺少 time`);return {time:time.slice(0,40),tz,title:title.slice(0,100),location:String(raw?.location||'').trim().slice(0,100),category,desc:String(raw?.desc||'').trim().slice(0,500),map:safeAIURL(raw?.map),img:safeAIURL(raw?.img),tag:String(raw?.tag||'').trim().slice(0,60),order:(index+1)*100}}
function normalizeAIImport(obj){if(!obj||typeof obj!=='object')throw new Error('JSON 格式不正確');let days=Array.isArray(obj.days)?obj.days:null;if(!days&&obj.day&&Array.isArray(obj.items))days=[obj];if(!days||!days.length)throw new Error('JSON 必須包含 days 陣列（或單日 day + items）');const seen=new Set(),out=[];for(const g of days){const day=Number(g.day),mode=day===4?(g.mode==='rain'?'rain':'sun'):'sun';if(day<1||day>5)throw new Error(`不支援 Day ${g.day}`);const key=`${day}-${mode}`;if(seen.has(key))throw new Error(`Day ${day} ${mode} 重複出現`);seen.add(key);if(!Array.isArray(g.items))throw new Error(`Day ${day} 缺少 items`);const items=g.items.map((x,i)=>normalizeAIItem(x,i));out.push({day,mode,items})}return {format:obj.format||'',days:out}}
function previewAIImport(){const el=document.getElementById('aiImportPreview'),apply=document.getElementById('aiImportApply');if(!el||!apply)return;try{const obj=extractAIJSON(document.getElementById('aiImportText')?.value||''),data=normalizeAIImport(obj);aiImportPreviewData=data;const formatWarn=data.format&&data.format!==AI_ITINERARY_FORMAT?`<div>⚠️ 格式版本為 ${esc(data.format)}，目前網站為 ${AI_ITINERARY_FORMAT}，仍可嘗試匯入。</div>`:'';el.className=`ai-preview ${formatWarn?'warn':'ok'}`;el.innerHTML=`<b>${formatWarn?'可以解析，但請確認版本':'✓ JSON 驗證通過'}</b>${formatWarn}<ul class="ai-preview-list">${data.days.map(g=>`<li>Day ${g.day}${g.day===4?` · ${g.mode==='rain'?'雨天':'晴天'}`:''}：${g.items.length} 個行程</li>`).join('')}</ul><div style="margin-top:6px">套用時會完整取代上述日／模式目前的行程，並先建立最近備份。</div>`;apply.innerHTML=`<button type="button" class="ai-bridge-btn green wide" onclick="applyAIImport()">✓ 套用 AI 整理結果</button>`}catch(e){aiImportPreviewData=null;el.className='ai-preview error';el.innerHTML=`<b>無法匯入</b><div>${esc(e.message||String(e))}</div>`;apply.innerHTML=''}}
async function applyAIImport(){if(!itineraryModifyMode)return;const data=aiImportPreviewData;if(!data)return previewAIImport();if(!authUserOK())return signInGoogle();const summary=data.days.map(g=>`Day ${g.day}${g.day===4?(g.mode==='rain'?' 雨天':' 晴天'):' '} ${g.items.length} 項`).join('\n');if(!confirm(`確定套用 AI 整理結果？\n\n${summary}\n\n目前內容會先保存成最近備份。`))return;if(!await ensureFirebase())return alert('請先登入');try{for(const g of data.days){await backupItinerary(g.day,g.mode,'AI 匯入前');await replaceItineraryMode(g.day,g.mode,g.items)}showNetworkToast('✓ AI 行程已匯入並同步');clearAIImport();closeAIBridge();if(currentPage==='trip')dayPage(selectedTripDay);else if(currentPage==='home')home()}catch(e){console.error(e);alert(`AI 匯入失敗：${e.message||e}\n已完成的日別可能已同步，可使用「最近備份」還原。`)}}

function itineraryFormHTML(day,mode){return `<div id="itineraryFormCard" class="itinerary-form-card hidden"><div class="itinerary-form-head"><div><b id="itineraryFormTitle">新增行程</b><small>Day ${day}${day===4?` · ${mode==='rain'?'雨天':'晴天'}`:''}</small></div><button type="button" class="itinerary-close" onclick="closeItineraryEditor()">×</button></div><form class="itinerary-form" onsubmit="submitItineraryForm(event)"><div class="itinerary-form-grid"><div class="itinerary-field"><label>🕐 時間</label><input id="itTime" maxlength="40" placeholder="例如 10:30–11:30" required></div><div class="itinerary-field"><label>🌏 時區</label><select id="itTz"><option value="JP">日本</option><option value="TW">台灣</option></select></div></div><div class="itinerary-field"><label>✨ 行程標題</label><input id="itTitle" maxlength="100" placeholder="例如：🍴 午餐｜博多拉麵" required></div><div class="itinerary-form-grid two"><div class="itinerary-field"><label>📍 地點</label><input id="itLocation" maxlength="100" placeholder="LaLaport Fukuoka"></div><div class="itinerary-field"><label>🏷️ 類型</label><select id="itCategory"><option value="main">主任務</option><option value="transport">交通</option><option value="meal">用餐</option><option value="rest">休息</option><option value="bonus">Bonus</option><option value="other">其他</option></select></div></div><div class="itinerary-field"><label>📝 說明</label><textarea id="itDesc" maxlength="500" placeholder="注意事項、集合方式、備註…"></textarea></div><div class="itinerary-field"><label>🗺️ Google Maps 連結</label><input id="itMap" type="url" placeholder="https://www.google.com/maps/..."></div><div class="itinerary-form-grid two"><div class="itinerary-field"><label>🖼️ 圖片網址（選填）</label><input id="itImg" type="url" placeholder="https://..."></div><div class="itinerary-field"><label>🏷️ 圖片標籤（選填）</label><input id="itTag" maxlength="60" placeholder="景點照片"></div></div><div class="itinerary-form-actions"><button id="itinerarySaveBtn" class="itinerary-save" type="submit">＋ 新增行程</button><button class="itinerary-cancel" type="button" onclick="closeItineraryEditor()">取消</button></div></form></div>`}

function weatherInfo(code){
 const c=Number(code);
 if(c===0)return {icon:'☀️',text:'晴朗'};
 if([1,2].includes(c))return {icon:'🌤️',text:c===1?'大致晴朗':'局部多雲'};
 if(c===3)return {icon:'☁️',text:'多雲'};
 if([45,48].includes(c))return {icon:'🌫️',text:'霧'};
 if([51,53,55,56,57].includes(c))return {icon:'🌦️',text:'毛毛雨'};
 if([61,63,65,66,67].includes(c))return {icon:'🌧️',text:'下雨'};
 if([71,73,75,77,85,86].includes(c))return {icon:'🌨️',text:'降雪'};
 if([80,81,82].includes(c))return {icon:'🌦️',text:'陣雨'};
 if([95,96,99].includes(c))return {icon:'⛈️',text:'雷雨'};
 return {icon:'🌤️',text:'天氣變化'};
}
let latestWeatherData=null,latestWeatherAt=0,weatherFetchPromise=null;
function weatherAdvice(d){
 const h=d.hourly||{},times=h.time||[],pops=h.precipitation_probability||[],codes=h.weather_code||[];const now=Date.now();let maxPop=0,rainSoon=false;
 times.forEach((t,i)=>{const ms=new Date(t+'+09:00').getTime();if(ms>=now&&ms<=now+6*3600000){maxPop=Math.max(maxPop,Number(pops[i]||0));if([51,53,55,56,57,61,63,65,66,67,80,81,82,95,96,99].includes(Number(codes[i])))rainSoon=true}});
 if(rainSoon||maxPop>=60)return {type:'rain',text:`接下來 6 小時最高降雨機率 ${maxPop}%｜雨具隨身，戶外行程保留彈性。`};
 if(maxPop>=35)return {type:'watch',text:`接下來 6 小時最高降雨機率 ${maxPop}%｜建議隨身帶傘。`};
 return {type:'ok',text:`接下來 6 小時降雨風險較低（最高 ${maxPop}%），仍注意 9 月高溫與補水。`}
}
function hourlyForecastHTML(d){const h=d.hourly||{},times=h.time||[],temps=h.temperature_2m||[],pops=h.precipitation_probability||[],codes=h.weather_code||[];const now=Date.now(),ctx=weatherContext();const rows=[];for(let i=0;i<times.length&&rows.length<6;i++){const ms=new Date(times[i]+'+09:00').getTime();if(ms>=now-1800000){const wi=weatherInfo(codes[i]);rows.push(`<div class="hourly-item"><div class="time">${times[i].slice(11,16)}</div><div class="icon" aria-hidden="true">${wi.icon}</div><div class="temp">${Math.round(temps[i])}°</div><div class="pop">☔ ${Number(pops[i]||0)}%</div></div>`)}}const advice=weatherAdvice(d),td=tripDayToday();const day4Btn=(td===4&&advice.type==='rain'&&day4Mode()!=='rain')?`<button onclick="day4ModeSwitch('rain');setPage('trip')">切雨天版</button>`:'';return `<div class="hourly-head"><div><b>🌤️ ${ctx.label}</b><small>${ctx.sub}</small></div><button class="weather-refresh" onclick="loadFukuokaWeather(true)" aria-label="更新福岡天氣預報">↻ 更新</button></div><div class="hourly-strip">${rows.join('')}</div><div class="weather-advice">${advice.type==='rain'?'🌧️':advice.type==='watch'?'☂️':'🌤️'} ${advice.text}${day4Btn}</div>`}
function renderFukuokaWeather(d){const el=document.getElementById('heroWeather'),forecast=document.getElementById('weatherForecast');if(!d)return;const c=d.current,w=weatherInfo(c.weather_code),temp=Math.round(c.temperature_2m),feel=Math.round(c.apparent_temperature),hum=Math.round(c.relative_humidity_2m),rain=Number(c.precipitation||0);if(el)el.innerHTML=`<span class="hw-icon" aria-hidden="true">${w.icon}</span><div><div class="hw-temp">${temp}°</div><div class="hw-text">${w.text} · 體感 ${feel}° · 濕度 ${hum}%${rain>0?' · '+rain+'mm':''}</div></div><button onclick="loadFukuokaWeather(true)" aria-label="更新福岡天氣">↻</button>`;if(forecast)forecast.innerHTML=hourlyForecastHTML(d)}
async function loadFukuokaWeather(force=false){
 const el=document.getElementById('heroWeather'),forecast=document.getElementById('weatherForecast');if(!el&&!forecast)return;
 if(!force&&latestWeatherData&&Date.now()-latestWeatherAt<600000){renderFukuokaWeather(latestWeatherData);return}
 if(!force&&weatherFetchPromise){try{renderFukuokaWeather(await weatherFetchPromise)}catch(e){}return}
 if(force&&el)el.innerHTML='<span class="hw-icon" aria-hidden="true">⏳</span><div><div class="hw-temp">--°</div><div class="hw-text">更新中…</div></div><button disabled aria-label="正在更新福岡天氣">↻</button>';

 try{const d=await weatherFetchPromise;latestWeatherData=d;latestWeatherAt=Date.now();renderFukuokaWeather(d)}catch(err){console.warn('Weather load failed',err);if(el)el.innerHTML='<span class="hw-icon" aria-hidden="true">🌥️</span><div><div class="hw-temp">--°</div><div class="hw-text">福岡天氣暫時無法更新</div></div><button onclick="loadFukuokaWeather(true)" aria-label="重新更新福岡天氣">↻</button>';if(forecast)forecast.innerHTML='<div class="weather-advice">目前無法取得預報，行程仍可正常使用。<button onclick="loadFukuokaWeather(true)">重試</button></div>'}finally{weatherFetchPromise=null}
}
let sharedDb=null,sharedAuth=null,sharedUser=null,sharedUnsubs=[];
let firestorePersistenceAttempted=false,authObserverBound=false;
let sharedAuthorized=false,sharedAuthorizedUid='',authorizationPromise=null;
function firebaseConfigured(){return FIREBASE_CONFIG&&FIREBASE_CONFIG.apiKey&&FIREBASE_CONFIG.projectId&&FIREBASE_CONFIG.appId}
function authUserOK(){return !!(sharedUser&&!sharedUser.isAnonymous&&sharedUser.emailVerified&&sharedAuthorized&&sharedAuthorizedUid===sharedUser.uid)}
async function refreshFamilyAuthorization(user){if(!user||user.isAnonymous){sharedAuthorized=false;sharedAuthorizedUid='';return false}if(sharedAuthorizedUid===user.uid)return sharedAuthorized;if(authorizationPromise)return authorizationPromise;const uid=user.uid;authorizationPromise=(async()=>{try{await sharedDb.collection('trips').doc(SHARED_TRIP_ID).collection('itineraryBackups').limit(1).get({source:'server'});sharedAuthorized=true;sharedAuthorizedUid=uid;return true}catch(e){sharedAuthorized=false;sharedAuthorizedUid=uid;if(e?.code!=='permission-denied'&&e?.code!=='unavailable')console.warn('Family authorization check',e?.code||e);return false}finally{authorizationPromise=null}})();return authorizationPromise}
async function initFirebase(){
 if(!firebaseConfigured())return false;
 try{
  if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);
  sharedAuth=firebase.auth();sharedDb=firebase.firestore();
  if(!firestorePersistenceAttempted){firestorePersistenceAttempted=true;try{await sharedDb.enablePersistence({synchronizeTabs:true})}catch(pErr){console.warn('Firestore offline persistence unavailable',pErr?.code||pErr)}}
  if(sharedAuth.currentUser?.isAnonymous){try{await sharedAuth.signOut()}catch(e){}}
  sharedUser=sharedAuth.currentUser&&!sharedAuth.currentUser?.isAnonymous?sharedAuth.currentUser:null;
  if(!authObserverBound){authObserverBound=true;sharedAuth.onAuthStateChanged(async user=>{sharedUser=user&&!user.isAnonymous?user:null;await refreshFamilyAuthorization(sharedUser);if(!authUserOK())itineraryModifyMode=false;stopItinerarySync();startItinerarySync();if(['checklist','gifts','more','secure','family','trip','home'].includes(currentPage))setTimeout(()=>setPage(currentPage,false),0)})}
  try{await sharedAuth.getRedirectResult()}catch(e){if(e?.code)console.warn('Google redirect result',e.code)}
  sharedUser=sharedAuth.currentUser&&!sharedAuth.currentUser?.isAnonymous?sharedAuth.currentUser:null;await refreshFamilyAuthorization(sharedUser);
  return true;
 }catch(e){console.error('Firebase init',e);return false}
}

async function signInGoogle(){

 try{const r=await sharedAuth.signInWithPopup(provider);sharedUser=r.user;await refreshFamilyAuthorization(sharedUser);if(!authUserOK())alert('這個 Google 帳號沒有家人權限，請改用已授權帳號。');else showNetworkToast('✓ Google 登入成功')}
 catch(e){console.warn('Google popup',e?.code||e);if(['auth/popup-blocked','auth/operation-not-supported-in-this-environment'].includes(e?.code)){try{await sharedAuth.signInWithRedirect(provider)}catch(rErr){alert('Google 登入失敗：'+(rErr?.message||rErr))}}else if(e?.code!=='auth/popup-closed-by-user')alert('Google 登入失敗：'+(e?.message||e))}

async function copyChecklistItem(id){if(!await ensureFirebase())return;const item=checklistCache.find(x=>x.id===id),target=document.getElementById('copyTarget-'+id)?.value;if(!item||!target)return;const duplicate=checklistCache.some(x=>normalizeCheckSection(x.section)===target&&String(x.text).trim().toLowerCase()===String(item.text).trim().toLowerCase());if(duplicate&&!confirm(`「${item.text}」在 ${checkSectionLabel(target)} 已存在，仍要再複製一份嗎？`))return;await checklistRef().add({text:item.text,section:target,done:false,createdAt:firebase.firestore.FieldValue.serverTimestamp(),updatedAt:firebase.firestore.FieldValue.serverTimestamp(),uid:sharedUser.uid,editorName:getEditorName()})}

function giftEditorIsCollapsed(){return document.getElementById('giftEditor')?.classList.contains('collapsed')??true}
function setGiftEditorCollapsed(collapsed,save=true){const card=document.getElementById('giftEditor'),btn=document.getElementById('giftCollapseBtn');if(!card)return;card.classList.toggle('collapsed',!!collapsed);if(btn)btn.textContent=collapsed?'展開 ▼':'收合 ▲';if(save)try{localStorage.setItem('fukuokaGiftEditorCollapsed',collapsed?'1':'0')}catch(e){}}
function initGiftEditorCollapse(){let collapsed=true;try{const saved=localStorage.getItem('fukuokaGiftEditorCollapsed');if(saved!==null)collapsed=saved==='1'}catch(e){}setGiftEditorCollapsed(collapsed,false)}
function toggleGiftEditor(){setGiftEditorCollapsed(!giftEditorIsCollapsed())}
function openGiftEditor(){setGiftEditorCollapsed(false);requestAnimationFrame(()=>document.getElementById('giftEditor')?.scrollIntoView({behavior:'smooth',block:'start'}))}
function priorityLabel(v){return ({must:'必買',high:'優先',normal:'普通',low:'有看到再買'})[v]||'普通'}
function giftTypeLabel(v){return v==='single'?'一次送':'分送'}
function setGiftChoice(kind,value){const hidden=document.getElementById(kind==='priority'?'giftPriority':'giftType');if(hidden)hidden.value=value;document.querySelectorAll(`[data-choice="${kind}"]`).forEach(b=>{const active=b.dataset.value===value;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active))})}
function uniqueGiftValues(field){return [...new Set(giftRowsCache.map(x=>String(x[field]||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'zh-Hant'))}
function renderGiftSuggestions(){[['giftRecipientList','recipient'],['giftShopList','shop'],['giftNameList','name']].forEach(([id,field])=>{const el=document.getElementById(id);if(el)el.innerHTML=uniqueGiftValues(field).map(v=>`<option value="${esc(v)}"></option>`).join('')})}
function renderGiftPresets(rows){const el=document.getElementById('giftPresets');if(!el)return;if(!rows.length){el.innerHTML='';return}const seen=new Set(),items=[];[...rows].reverse().forEach(x=>{const key=`${x.recipient||''}|${x.name||''}|${x.shop||''}`;if(!seen.has(key)&&items.length<6){seen.add(key);items.push(x)}});el.innerHTML=`<div class="gift-presets-head"><b>✨ 快速帶入已填資料</b><small>點一下，填入上方表單後可再修改</small></div><div class="gift-preset-list">${items.map(x=>`<button type="button" class="gift-preset" onclick="loadGiftPreset('${x.id}')"><b>${esc(x.name||'待補品項')}</b><small>👤 ${esc(x.recipient||'未指定')}${x.shop?' · '+esc(x.shop):''}</small></button>`).join('')}</div>`}
function fillGiftForm(x){document.getElementById('giftRecipient').value=x.recipient||'';document.getElementById('giftShop').value=x.shop||x.place||'';document.getElementById('giftName').value=x.name||'';document.getElementById('giftQty').value=Math.max(1,Number(x.qty)||1);document.getElementById('giftBudget').value=Number(x.budget)||'';document.getElementById('giftNote').value=x.note||'';setGiftChoice('priority',x.priority||'normal');setGiftChoice('type',x.giftType||'split')}
function resetGiftForm(){giftEditingId=null;const form=document.getElementById('giftForm');if(form)form.reset();const qty=document.getElementById('giftQty');if(qty)qty.value=1;setGiftChoice('priority','normal');setGiftChoice('type','split');const title=document.getElementById('giftFormTitle'),eye=document.getElementById('giftFormEyebrow'),btn=document.getElementById('giftSubmitBtn'),cancel=document.getElementById('giftCancelBtn'),card=document.getElementById('giftEditor');if(title)title.textContent='新增伴手禮';if(eye)eye.textContent='NEW SOUVENIR';if(btn)btn.textContent='＋ 新增伴手禮';if(cancel)cancel.classList.add('hidden');if(card)card.classList.remove('editing')}
function editGift(id){const x=giftRowsCache.find(r=>r.id===id);if(!x)return;expandRecipientByName((x.recipient||'').trim()||'未指定對象');giftEditingId=id;fillGiftForm(x);const title=document.getElementById('giftFormTitle'),eye=document.getElementById('giftFormEyebrow'),btn=document.getElementById('giftSubmitBtn'),cancel=document.getElementById('giftCancelBtn'),card=document.getElementById('giftEditor');if(title)title.textContent='編輯伴手禮';if(eye)eye.textContent='EDIT SOUVENIR';if(btn)btn.textContent='✓ 儲存修改';if(cancel)cancel.classList.remove('hidden');if(card)card.classList.add('editing');openGiftEditor()}
function loadGiftPreset(id){const x=giftRowsCache.find(r=>r.id===id);if(!x)return;resetGiftForm();fillGiftForm(x);const title=document.getElementById('giftFormTitle'),eye=document.getElementById('giftFormEyebrow'),btn=document.getElementById('giftSubmitBtn');if(title)title.textContent='以既有資料新增';if(eye)eye.textContent='QUICK FILL';if(btn)btn.textContent='＋ 另存為新伴手禮';openGiftEditor()}
async function submitGiftForm(e){e.preventDefault();if(!await ensureFirebase())return alert('請先使用 Google 登入家人帳號');const name=document.getElementById('giftName').value.trim(),recipient=document.getElementById('giftRecipient').value.trim();if(!recipient)return alert('請先填寫「要送的人」');const hasItem=!!name;const data={recipient,shop:document.getElementById('giftShop').value.trim(),name,priority:document.getElementById('giftPriority').value||'normal',giftType:document.getElementById('giftType').value||'split',qty:hasItem?(Number(document.getElementById('giftQty').value)||1):0,budget:Number(document.getElementById('giftBudget').value)||0,note:document.getElementById('giftNote').value.trim(),draft:!hasItem,updatedAt:firebase.firestore.FieldValue.serverTimestamp(),uid:sharedUser.uid,editorName:getEditorName()};if(giftEditingId){await giftsRef().doc(giftEditingId).update(data)}else{await giftsRef().add({...data,done:false,createdAt:firebase.firestore.FieldValue.serverTimestamp()})}resetGiftForm()}
const RECIPIENT_COLLAPSE_KEY='fukuokaRecipientCollapseV3';
function recipientCollapseState(){try{return JSON.parse(localStorage.getItem(RECIPIENT_COLLAPSE_KEY)||'{}')||{}}catch(e){return {}}}
function recipientIsCollapsed(name){const state=recipientCollapseState();return Object.prototype.hasOwnProperty.call(state,name)?!!state[name]:true}
function saveRecipientCollapsed(name,collapsed){const state=recipientCollapseState();state[name]=!!collapsed;try{localStorage.setItem(RECIPIENT_COLLAPSE_KEY,JSON.stringify(state))}catch(e){}}
function toggleRecipientGroup(btn){const group=btn.closest('.recipient-group');if(!group)return;const name=btn.dataset.recipient||'';const collapsed=!group.classList.contains('collapsed');group.classList.toggle('collapsed',collapsed);btn.setAttribute('aria-expanded',collapsed?'false':'true');saveRecipientCollapsed(name,collapsed)}
function setAllRecipientGroups(collapsed){const state=recipientCollapseState();document.querySelectorAll('.recipient-group').forEach(group=>{const btn=group.querySelector('.recipient-head'),name=btn?.dataset.recipient||'';group.classList.toggle('collapsed',collapsed);if(btn)btn.setAttribute('aria-expanded',collapsed?'false':'true');if(name)state[name]=!!collapsed});try{localStorage.setItem(RECIPIENT_COLLAPSE_KEY,JSON.stringify(state))}catch(e){}}
function expandRecipientByName(name){document.querySelectorAll('.recipient-head').forEach(btn=>{if((btn.dataset.recipient||'')===name){const group=btn.closest('.recipient-group');group?.classList.remove('collapsed');btn.setAttribute('aria-expanded','true');saveRecipientCollapsed(name,false)}})}
function setGiftViewMode(mode){giftViewMode=mode==='shop'?'shop':'recipient';localStorage.setItem('fukuokaGiftViewMode',giftViewMode);const group=document.querySelector('.gift-view-toggle'),recipient=document.getElementById('giftModeRecipient'),shop=document.getElementById('giftModeShop');group?.setAttribute('role','group');group?.setAttribute('aria-label','伴手禮檢視模式');recipient?.classList.toggle('active',giftViewMode==='recipient');recipient?.setAttribute('aria-pressed',String(giftViewMode==='recipient'));shop?.classList.toggle('active',giftViewMode==='shop');shop?.setAttribute('aria-pressed',String(giftViewMode==='shop'));document.getElementById('recipientToolbar')?.classList.toggle('hidden',giftViewMode==='shop');renderGiftMainList()}
function renderGiftMainList(){const el=document.getElementById('giftList');if(!el)return;document.getElementById('recipientToolbar')?.classList.toggle('hidden',giftViewMode==='shop');if(!giftRowsCache.length){el.innerHTML=`<div class="list-empty">目前沒有伴手禮。${authUserOK()?'可以從上方新增第一個。':'登入家人帳號後可以新增內容。'}</div>`;return}el.innerHTML=giftViewMode==='shop'?giftShopGroupsHTML(giftRowsCache):giftGroupsHTML(giftRowsCache)}
function giftShopGroupsHTML(rows){const filled=rows.filter(x=>(x.name||'').trim()),groups={};filled.forEach(x=>{const shop=(x.shop||x.place||'').trim()||'尚未指定店名';const key=shop+'||'+x.name.trim();if(!groups[key])groups[key]={shop,name:x.name.trim(),rows:[]};groups[key].rows.push(x)});if(!filled.length)return '<div class="list-empty">目前只有收禮人，補上「店名／品項」後就會出現購物模式。</div>';const byShop={};Object.values(groups).forEach(g=>(byShop[g.shop]||(byShop[g.shop]=[])).push(g));return Object.entries(byShop).sort((a,b)=>a[0].localeCompare(b[0],'zh-Hant')).map(([shop,items])=>`<section class="shop-group"><div class="shop-group-head"><b>🏬 ${esc(shop)}</b><small>${items.length} 種品項</small></div>${items.sort((a,b)=>a.name.localeCompare(b.name,'zh-Hant')).map(g=>{const planned=g.rows.reduce((n,x)=>n+Math.max(1,Number(x.qty)||1),0),bought=g.rows.filter(x=>x.done).reduce((n,x)=>n+Math.max(1,Number(x.qty)||1),0),remain=Math.max(0,planned-bought),recips=[...new Set(g.rows.map(x=>(x.recipient||'').trim()).filter(Boolean))];return `<div class="shop-buy-row"><div class="shop-buy-main"><b>${esc(g.name)}</b><small>送：${esc(recips.join('、')||'未指定')} · ${remain?`還差 ${remain}`:'已買齊'}</small></div><div class="shop-buy-qty"><strong>× ${planned}</strong><span>已買 ${bought}</span>${remain&&authUserOK()?`<button class="shop-buy-btn" onclick="markGiftGroupDone('${encodeURIComponent(shop)}','${encodeURIComponent(g.name)}')">✓ 全部買齊</button>`:''}</div></div>`}).join('')}</section>`).join('')}
async function markGiftGroupDone(shopEnc,nameEnc){if(!await ensureFirebase())return;const shop=decodeURIComponent(shopEnc),name=decodeURIComponent(nameEnc),rows=giftRowsCache.filter(x=>(x.name||'').trim()===name&&((x.shop||x.place||'').trim()||'尚未指定店名')===shop&&!x.done);if(!rows.length)return;const batch=sharedDb.batch();rows.forEach(x=>batch.update(giftsRef().doc(x.id),{done:true,updatedAt:firebase.firestore.FieldValue.serverTimestamp(),uid:sharedUser.uid,editorName:getEditorName()}));await batch.commit()}

const SECURE_DRIVE_FOLDER_KEY='fukuokaSecureDriveFolderV45';

function secureStorageKey(base){return `${base}:${sharedUser?.uid||'no-user'}`}
function migrateLegacySecureStorage(){if(!sharedUser?.uid)return;[SECURE_DRIVE_FOLDER_KEY,SECURE_SHORTCUTS_KEY].forEach(base=>{const scoped=secureStorageKey(base),legacy=localStorage.getItem(base);if(legacy!==null&&localStorage.getItem(scoped)===null)localStorage.setItem(scoped,legacy)})}
let secureEditingId=null;
const SECURE_CATEGORIES=[
 {id:'passport',label:'🛂 護照影本'},
 {id:'visit',label:'🇯🇵 Visit Japan'},
 {id:'flight',label:'✈️ 航班文件'},

function safeDriveURL(raw){try{const u=new URL(String(raw||'').trim());const ok=['drive.google.com','docs.google.com'].includes(u.hostname);return ok?u.href:''}catch(e){return ''}}
function driveFileId(url){const s=String(url||'');return s.match(/\/file\/d\/([a-zA-Z0-9_-]+)/)?.[1]||s.match(/[?&]id=([a-zA-Z0-9_-]+)/)?.[1]||''}

const EXCHANGE_CACHE_KEY='fukuokaExchangeJPYTWV53',EXCHANGE_MANUAL_KEY='fukuokaExchangeManualV53',EXCHANGE_BUFFER_KEY='fukuokaExchangeBufferV53';
let exchangeDirection='JPY_TWD',exchangeBuffer=Number(localStorage.getItem(EXCHANGE_BUFFER_KEY))||0,exchangeLive=null,exchangeFetchPromise=null;
function exchangeCache(){try{const x=JSON.parse(localStorage.getItem(EXCHANGE_CACHE_KEY)||'null');return x&&Number(x.rate)>0?x:null}catch(e){return null}}
function exchangeManualRate(){const n=Number(localStorage.getItem(EXCHANGE_MANUAL_KEY));return n>0?n:null}
function effectiveExchange(){const manual=exchangeManualRate(),live=exchangeLive||exchangeCache();return manual?{rate:manual,manual:true,updatedAt:Date.now()}:(live?{...live,manual:false}:null)}
function exchangeNumber(v){const n=Number(String(v||'').replace(/,/g,'').trim());return Number.isFinite(n)&&n>=0?n:0}
function exchangeFormat(n,currency){if(!Number.isFinite(n))return '';const digits=currency==='JPY'?0:2;return new Intl.NumberFormat('zh-TW',{maximumFractionDigits:digits,minimumFractionDigits:0}).format(n)}
function exchangeWidgetHTML(){return `<section id="exchangeSection" class="section"><div class="section-head"><div><div class="eyebrow">CURRENCY TOOL</div><h2>日幣／台幣匯率換算</h2></div></div><div class="exchange-card"><div class="exchange-head"><div><div class="eyebrow">JPY ↔ TWD</div><h3>購物時快速估算</h3></div><button id="ratePill" class="rate-pill" type="button" onclick="loadExchangeRate(true)">取得匯率</button></div><div class="currency-pair"><div class="currency-field"><label id="exchangeFromLabel" for="exchangeFrom">日幣 JPY</label><input id="exchangeFrom" inputmode="decimal" autocomplete="off" value="1000" oninput="calculateExchange()"></div><button class="currency-swap" type="button" onclick="swapExchange()" aria-label="交換日幣與台幣方向">⇄</button><div class="currency-field"><label id="exchangeToLabel" for="exchangeTo">台幣 TWD</label><input id="exchangeTo" inputmode="decimal" autocomplete="off" readonly aria-live="polite"></div></div><div id="exchangeQuick" class="quick-amounts"></div><div class="buffer-options" role="group" aria-label="刷卡或換匯緩衝"><button data-buffer="0" onclick="setExchangeBuffer(0)">原始匯率</button><button data-buffer="1.5" onclick="setExchangeBuffer(1.5)">＋1.5% 緩衝</button><button data-buffer="3" onclick="setExchangeBuffer(3)">＋3% 緩衝</button></div><div id="rateMeta" class="rate-meta">正在讀取最近一次匯率…</div><details class="manual-rate"><summary>網路不穩？手動輸入 1 JPY 可換多少 TWD</summary><div class="manual-row"><input id="manualRateInput" inputmode="decimal" placeholder="例如 0.22" aria-label="手動日幣兌台幣匯率"><button type="button" onclick="saveManualExchangeRate()">套用</button></div><button id="manualRateClear" class="subpage-back hidden" type="button" onclick="clearManualExchangeRate()">改回每日匯率</button></details></div></section>`}
function updateExchangeUI(){const from=document.getElementById('exchangeFrom'),to=document.getElementById('exchangeTo');if(!from||!to)return;const fromCurrency=exchangeDirection==='JPY_TWD'?'JPY':'TWD',toCurrency=exchangeDirection==='JPY_TWD'?'TWD':'JPY';document.getElementById('exchangeFromLabel').textContent=fromCurrency==='JPY'?'日幣 JPY':'台幣 TWD';document.getElementById('exchangeToLabel').textContent=toCurrency==='TWD'?'台幣 TWD':'日幣 JPY';const quick=fromCurrency==='JPY'?[1000,3000,5000,10000]:[500,1000,3000,5000];document.getElementById('exchangeQuick').innerHTML=quick.map(n=>`<button type="button" onclick="setExchangeAmount(${n})">${fromCurrency==='JPY'?'¥':'NT$'}${n.toLocaleString()}</button>`).join('');document.querySelectorAll('.buffer-options button').forEach(b=>b.classList.toggle('active',Number(b.dataset.buffer)===exchangeBuffer));const state=effectiveExchange(),pill=document.getElementById('ratePill'),meta=document.getElementById('rateMeta'),clear=document.getElementById('manualRateClear');clear?.classList.toggle('hidden',!exchangeManualRate());if(state){pill.className='rate-pill';pill.textContent=state.manual?'手動匯率':'更新匯率';const time=state.manual?'本裝置手動設定':`資料時間：${new Intl.DateTimeFormat('zh-TW',{dateStyle:'medium',timeStyle:'short',timeZone:'Asia/Taipei'}).format(new Date(state.updatedAt||state.fetchedAt||Date.now()))}`;meta.innerHTML=`1 JPY ≈ <b>${Number(state.rate).toFixed(4)} TWD</b> · ${time}<br>${exchangeBuffer?`已加入 ${exchangeBuffer}% 預估緩衝。`:''}每日參考匯率，現金、信用卡與銀行實際結算會不同。資料：<a class="facility-link" href="https://www.exchangerate-api.com" target="_blank" rel="noopener noreferrer">ExchangeRate-API ↗</a>`}else{pill.className='rate-pill error';pill.textContent='重試匯率';meta.textContent=navigator.onLine?'尚未取得匯率，可重試或手動輸入。':'目前離線且沒有舊匯率，請手動輸入後換算。'}calculateExchange()}
function calculateExchange(){const from=document.getElementById('exchangeFrom'),to=document.getElementById('exchangeTo'),state=effectiveExchange();if(!from||!to)return;if(!state){to.value='';return}const n=exchangeNumber(from.value),adjusted=Number(state.rate)*(1+exchangeBuffer/100),result=exchangeDirection==='JPY_TWD'?n*adjusted:n/adjusted;to.value=exchangeFormat(result,exchangeDirection==='JPY_TWD'?'TWD':'JPY')}
function setExchangeAmount(n){const el=document.getElementById('exchangeFrom');if(el){el.value=String(n);calculateExchange()}}
function swapExchange(){const result=exchangeNumber(document.getElementById('exchangeTo')?.value);exchangeDirection=exchangeDirection==='JPY_TWD'?'TWD_JPY':'JPY_TWD';updateExchangeUI();const from=document.getElementById('exchangeFrom');if(from&&result){from.value=String(result);calculateExchange()}}
function setExchangeBuffer(n){exchangeBuffer=Number(n)||0;localStorage.setItem(EXCHANGE_BUFFER_KEY,String(exchangeBuffer));updateExchangeUI()}
async function loadExchangeRate(force=false){const cached=exchangeCache();if(cached)exchangeLive=cached;updateExchangeUI();if(!force&&cached&&Date.now()-Number(cached.fetchedAt||0)<86400000)return;if(exchangeFetchPromise)return exchangeFetchPromise;const pill=document.getElementById('ratePill');if(pill){pill.textContent='更新中…';pill.disabled=true}exchangeFetchPromise=(async()=>{const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),10000);try{const r=await fetch(EXCHANGE_RATE_URL,{cache:'no-store',signal:controller.signal});if(!r.ok)throw new Error('rate '+r.status);const d=await r.json(),rate=Number(d?.rates?.TWD);if(!(rate>0))throw new Error('TWD rate missing');const fresh={rate,updatedAt:d.time_last_update_unix?d.time_last_update_unix*1000:Date.now(),fetchedAt:Date.now()};localStorage.setItem(EXCHANGE_CACHE_KEY,JSON.stringify(fresh));exchangeLive=fresh;return fresh}finally{clearTimeout(timer)}})();try{await exchangeFetchPromise}catch(e){console.warn('Exchange rate load failed',e)}finally{exchangeFetchPromise=null;if(pill)pill.disabled=false;updateExchangeUI()}}
function saveManualExchangeRate(){const input=document.getElementById('manualRateInput'),n=Number(input?.value),meta=document.getElementById('rateMeta');if(!(n>0&&n<10)){if(meta)meta.innerHTML='<span class="field-error" role="alert">請輸入大於 0、且合理的 1 JPY 對 TWD 匯率。</span>';input?.focus();return}localStorage.setItem(EXCHANGE_MANUAL_KEY,String(n));updateExchangeUI();showNetworkToast('✓ 已套用手動匯率')}
function clearManualExchangeRate(){localStorage.removeItem(EXCHANGE_MANUAL_KEY);updateExchangeUI();loadExchangeRate(true)}

function exchangeEntryHTML(){return `<section class="section"><div class="exchange-entry"><div><h3>日幣／台幣匯率換算</h3><p>獨立工具頁，購物時可快速輸入、交換幣別並套用刷卡緩衝。</p></div><button type="button" onclick="openExchange()">開啟換算工具 →</button></div></section>`}

</div>${privateFieldHTML('jojoName','訂位姓名','')}${privateFieldHTML('jojoCode','敘敘苑訂位編號','') }<div class="private-field"><label for="delibagStatus">DELIBAG 行李配送</label><select id="delibagStatus"><option value="">尚未設定</option><option>待預約</option><option>已預約</option><option>已付款</option><option>已交寄</option><option>已送達</option></select></div>${privateFieldHTML('delibagCode','DELIBAG 預約編號','') }<div class="private-field full"><label for="ticketNotes">票券／其他預約備註</label><textarea id="ticketNotes" maxlength="300" placeholder="麵包超人、Marine World、餐廳或其他票券狀態"></textarea></div></div></section><button class="private-save" type="submit">儲存家人私人狀態</button><div id="privateSync" class="private-sync" role="status" aria-live="polite">正在讀取家人資料…</div></form>`}
function fillPrivateTravelStatus(data={}){privateStatusCache=data;PRIVATE_FIELDS.forEach(id=>{const el=document.getElementById(id);if(el)el.value=data[id]||''});PRIVATE_CHECKS.forEach(id=>{const el=document.getElementById(id);if(el)el.checked=!!data[id]});const sync=document.getElementById('privateSync'),updated=timestampText(data.updatedAt);if(sync)sync.textContent=data.updatedAt?`已同步${updated?' · '+updated:''}${data.editorName?' · '+data.editorName:''}`:'尚未建立私人狀態，填寫後按儲存。'}
function subscribePrivateTravelStatus(){const sync=document.getElementById('privateSync');const unsub=privateStatusRef().onSnapshot(s=>fillPrivateTravelStatus(s.exists?s.data():{}),e=>{console.error('Private status',e);if(sync)sync.textContent=navigator.onLine?'私人資料讀取失敗，請確認安全規則已發布。':'目前離線且這台裝置尚未快取私人資料。'});sharedUnsubs.push(unsub)}
async function savePrivateTravelStatus(e){e.preventDefault();const button=e.submitter||document.querySelector('.private-save');if(button?.disabled)return;if(!await ensureFirebase())return alert('請先登入有家人權限的 Google 帳號');const data={};PRIVATE_FIELDS.forEach(id=>{const el=document.getElementById(id);if(el)data[id]=String(el.value||'').trim().slice(0,id==='ticketNotes'?300:120)});PRIVATE_CHECKS.forEach(id=>data[id]=!!document.getElementById(id)?.checked);data.updatedAt=firebase.firestore.FieldValue.serverTimestamp();data.uid=sharedUser.uid;data.editorName=getEditorName();const sync=document.getElementById('privateSync'),original=button?.textContent;if(button){button.disabled=true;button.textContent='正在安全同步…'}if(sync)sync.textContent='正在安全同步…';try{await privateStatusRef().set(data,{merge:true});if(sync)sync.textContent='✓ 已安全同步家人私人狀態';showNetworkToast('✓ 家人私人狀態已儲存')}catch(err){console.error(err);if(sync)sync.textContent=navigator.onLine?'儲存失敗：請確認家人權限與最新版 Firestore Rules 後再試一次。':'目前離線，Firestore 會在恢復網路後嘗試同步。'}finally{if(button){button.disabled=false;button.textContent=original||'儲存家人私人狀態'}}}
async function familyPage(routeToken=navigationToken){clearSharedListeners();await initFirebase();if(routeToken!==navigationToken||currentPage!=='family')return;if(!authUserOK()){content.innerHTML=`${backToMoreHTML()}<section class="section permission-shell"><div class="secure-hero"><div class="secure-ico">🩺</div><h2>家人醫療與預約</h2><p>孕期、孩子、保險、MEDIF 進度與訂位代碼只讓已授權家人帳號讀寫。</p></div>${authGateHTML('家人醫療與預約')}</section>`;return}content.innerHTML=`${backToMoreHTML()}<section class="section"><div class="info-hero"><div class="eyebrow">FAMILY PRIVATE STATUS</div><h2>醫療與預約中心</h2><p>這些欄位會同步給已授權家人；文件本體請繼續放在私人 Google Drive。</p></div></section><section class="section"><div class="notice warn"><b>安全範圍：</b>此頁資料位於家人專用 Firestore 子集合。未登入或非家人帳號不能讀取；公開頁面也不會顯示內容。</div></section>${familyPrivateFormHTML()}<section class="section"><div class="actions"><button class="btn" onclick="setPage('secure')">開啟私人文件捷徑</button><button class="btn" onclick="setPage('emergency')">緊急與醫療求助</button><a class="btn" href="https://www.evaair.com/en-us/fly-prepare/special-assistance-and-inquiry/travelling-when-pregnant/" target="_blank" rel="noopener noreferrer">長榮孕婦搭機規定 ↗</a></div></section>`;subscribePrivateTravelStatus()}

async function morePage(routeToken=navigationToken){

 const account=`<section class="section"><div class="section-head"><div><div class="eyebrow">ACCOUNT</div><h2>Google 家人帳號</h2></div></div>${authSetupWarning()}${authAccountHTML()}${authUserOK()?`<div class="editor-card"><b style="font-size:15px;color:#6f5347">✏️ 共同編輯顯示名稱</b><div class="editor-current" id="editorNameStatus">預設使用 Google 顯示名稱；需要的話可在這台裝置自訂暱稱。</div><div class="editor-row"><input id="editorNameInput" maxlength="24" value="${esc(localStorage.getItem('fukuokaEditorName')||'')}" placeholder="留空＝使用 Google 顯示名稱"><button onclick="saveEditorName()">儲存</button></div></div>`:''}</section>`;

arget="_blank" rel="noopener noreferrer">長榮航班動態 ↗</a></div></div></section>${account}${pwaCardHTML()}`;updateExchangeUI();loadExchangeRate()

function reducedMotion(){return window.matchMedia('(prefers-reduced-motion: reduce)').matches}
function updateNavState(day){const subpages=new Set(['secure','family','emergency','flight','hotel','exchange']),navDay=subpages.has(String(day))?'more':String(day);document.querySelectorAll('.nav-btn').forEach(b=>{const active=b.dataset.day===navDay;b.classList.toggle('active',active);if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')})}
function routeLoadingHTML(label){return `<div class="route-loading" role="status" aria-live="polite"><div><b>正在開啟${esc(label)}</b><span>載入最新資料與同步狀態…</span></div></div>`}
function updatePageHistory(day){history.replaceState({...history.state,scrollY:window.scrollY},'',location.href);const u=new URL(location.href);if(day==='home'){u.searchParams.delete('page');u.searchParams.delete('day')}else{u.searchParams.set('page',day);if(day==='trip')u.searchParams.set('day',String(selectedTripDay));else u.searchParams.delete('day')}history.pushState({page:day,day:selectedTripDay,scrollY:0},'',u)}
function setPage(day,scroll=true){const token=++navigationToken;if(day!=='trip'&&!(Number(day)>=1&&Number(day)<=5))destroyTripRouteMap();currentPage=String(day);document.body.classList.toggle('inner-page',day!=='home');updateHeroTripStats();updateCountdown();updateNavState(day);clearSharedListeners();if(day==='home')home();else if(day==='trip')tripHubPage();else if(day==='checklist'){content.innerHTML=routeLoadingHTML('共同清單');checklistPage(token)}else if(day==='gifts'){content.innerHTML=routeLoadingHTML('伴手禮');giftsPage(token)}else if(day==='more'){content.innerHTML=routeLoadingHTML('旅遊資訊中心');morePage(token)}else if(day==='secure'){content.innerHTML=routeLoadingHTML('重要資料');securePage(token)}else if(day==='family'){content.innerHTML=routeLoadingHTML('家人醫療與預約');familyPage(token)}else if(day==='emergency')emergencyPage();else if(day==='flight')flightPage();else if(day==='hotel')hotelPage();else if(day==='exchange')exchangePage();else{selectedTripDay=Number(day)||selectedTripDay;currentPage='trip';document.body.classList.add('inner-page');updateNavState('trip');dayPage(selectedTripDay)}if(scroll){updatePageHistory(currentPage);window.scrollTo({top:0,behavior:reducedMotion()?'auto':'smooth'});requestAnimationFrame(()=>content.focus({preventScroll:true}))}}
function markTodayNav(){const td=tripDayToday();document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('today',!!td&&b.dataset.day==='trip'))}
function updateHeroTripStats(){const el=document.getElementById('heroTripStats');if(!el)return;el.innerHTML='<div class="hero-stat"><b>去程 · BR106</b><small>08:00 → 11:20</small></div><div class="hero-stat"><b>住宿 · Quintessa</b><small>藥院站旁</small></div><div class="hero-stat"><b>回程 · BR105</b><small>12:20 → 13:45</small></div>'}
function updateCountdown(){const now=new Date(),start=new Date('2026-09-09T04:30:00+08:00'),end=new Date('2026-09-13T13:45:00+08:00');let txt='';if(now<start){const d=Math.ceil((start-now)/86400000);txt=`距離出發約 ${d} 天｜9/6 產檢＋MEDIF`}else if(now>end){txt='旅程已完成，這份頁面就是我們的福岡旅行紀錄 ✨'}else{const td=tripDayToday();txt=td?`旅行進行中｜今天是 Day ${td}，只完成主任務也很棒 👍`:'家庭旅行進行中'}document.getElementById('countdown').textContent=txt}
function refreshCurrentEventMarkers(){if(currentPage!=='trip')return;const timeline=document.querySelector(`.timeline[data-day="${selectedTripDay}"]`);if(!timeline)return;const events=eventsForDay(selectedTripDay),cur=currentEventIndex(selectedTripDay,events);timeline.querySelectorAll('.event').forEach((el,i)=>el.classList.toggle('current-event',i===cur))}
function refreshTimeSensitiveUI(){updateCountdown();markTodayNav();if(currentPage==='home'){const current=document.getElementById('nextStopSection'),fresh=nextStopCardHTML();if(current&&fresh){const box=document.createElement('div');box.innerHTML=fresh;current.replaceWith(box.firstElementChild)}}else refreshCurrentEventMarkers()}
let photoReturnFocus=null;
function openPhoto(src,alt){const m=document.getElementById('photoModal'),im=document.getElementById('modalImage');photoReturnFocus=document.activeElement;im.src=src;im.alt=alt||'照片';m.classList.add('show');m.setAttribute('aria-hidden','false');document.querySelector('.app')?.setAttribute('inert','');document.querySelector('.bottom-nav')?.setAttribute('inert','');document.body.style.overflow='hidden';m.querySelector('.photo-close').focus()}
function closePhoto(e){if(e&&e.target.id==='modalImage')return;const m=document.getElementById('photoModal');m.classList.remove('show');m.setAttribute('aria-hidden','true');document.querySelector('.app')?.removeAttribute('inert');document.querySelector('.bottom-nav')?.removeAttribute('inert');document.body.style.overflow='';if(photoReturnFocus?.focus)photoReturnFocus.focus();photoReturnFocus=null}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('tripRouteMapPanel')?.classList.contains('expanded')){e.preventDefault();toggleTripRouteMapSize(false);document.getElementById('routeMapSizeToggle')?.focus()}});

function ensureAccessibleFormNames(root=document){root.querySelectorAll('input:not([aria-label]):not([aria-labelledby]),select:not([aria-label]):not([aria-labelledby]),textarea:not([aria-label]):not([aria-labelledby])').forEach((field,index)=>{const linked=field.id&&root.querySelector('label[for="'+CSS.escape(field.id)+'"]');if(linked)return;const hint=field.getAttribute('placeholder')||field.getAttribute('name')||field.closest('.itinerary-field,.gift-field')?.querySelector('label')?.textContent?.trim()||('輸入欄位 '+(index+1));field.setAttribute('aria-label',hint)});root.querySelectorAll('.ai-bridge-close:not([aria-label])').forEach(button=>button.setAttribute('aria-label','關閉 AI 行程工具'));root.querySelectorAll('.itinerary-close:not([aria-label])').forEach(button=>button.setAttribute('aria-label','關閉行程編輯器'))}

try{initFirebase();updateCountdown();markTodayNav();const params=new URLSearchParams(location.search),launchPage=params.get('page'),launchDay=Number(params.get('day')),allowedLaunchPages=new Set(['home','trip','checklist','gifts','more','secure','family','emergency','flight','hotel','exchange']);if(launchDay>=1&&launchDay<=5){selectedTripDay=launchDay;localStorage.setItem('fukuokaSelectedTripDay',String(launchDay))}const firstPage=allowedLaunchPages.has(launchPage)?launchPage:'home';history.replaceState({page:firstPage,day:selectedTripDay},'',location.href);setPage(firstPage,false);setInterval(refreshTimeSensitiveUI,60000)}catch(err){console.error(err);content.innerHTML='<div class="notice danger">頁面載入失敗，請重新整理或重新上傳最新版 index.html。</div>'}
