  const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date());
  const o={};parts.forEach(p=>o[p.type]=p.value);return {date:`${o.year}-${o.month}-${o.day}`,min:Number(o.hour)*60+Number(o.minute)};
}
function tripDayToday(){const t=jpNow().date;return {'2026-09-09':1,'2026-09-10':2,'2026-09-11':3,'2026-09-12':4,'2026-09-13':5}[t]||null}
function firstTimeMinutes(s){const m=s.match(/(\d{1,2}):(\d{2})/);return m?Number(m[1])*60+Number(m[2]):null}
function currentEventIndex(day,events){if(tripDayToday()!==day)return -1;const ev=events||trip.days[day].events,now=jpNow().min;let idx=-1;for(let i=0;i<ev.length;i++){const st=firstTimeMinutes(ev[i].time);if(st!==null&&st<=now)idx=i}return idx<0?0:idx}

function weatherInfo(code){
 const c=Number(code);
 if(c===0)return {icon:'☀️',text:'晴朗'};
 if([1,2].includes(c))return {icon:'🌤️',text:c===1?'大致晴朗':'局部多雲'};
 if(c===3)return {icon:'☁️',text:'多雲'};
 if([45,48].includes(c))return {icon:'🌫️',text:'霧'};
 if([51,53,55,56,57].includes(c))return {icon:'🌦️',text:'毛毛雨'};
 if([61,63,65,66,67].includes(c))return {icon:'🌧️',text:'下雨'};
 if([71,73,75,77,85,86].includes(c))return {icon:'🌨️',text:'降雪'};
 if([80,81,82].includes(c))return {icon:'🌦️',text:'陣雨'};
 if([95,96,99].includes(c))return {icon:'⛈️',text:'雷雨'};
 return {icon:'🌤️',text:'天氣變化'};
}
async function loadFukuokaWeather(force=false){

 }catch(err){console.warn('Weather load failed',err);el.innerHTML='<span class="hw-icon">🌥️</span><div><div class="hw-temp">--°</div><div class="hw-text">福岡天氣暫時無法更新</div></div><button onclick="loadFukuokaWeather(true)" aria-label="重新更新福岡天氣">↻</button>'}

let sharedDb=null,sharedAuth=null,sharedUser=null,sharedUnsubs=[];
function firebaseConfigured(){return FIREBASE_CONFIG&&FIREBASE_CONFIG.apiKey&&FIREBASE_CONFIG.projectId&&FIREBASE_CONFIG.appId}
async function ensureFirebase(){
 if(!firebaseConfigured())return false;
 if(sharedDb&&sharedUser)return true;
 try{
  if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);
  sharedAuth=firebase.auth();sharedDb=firebase.firestore();
  if(!sharedAuth.currentUser)await sharedAuth.signInAnonymously();
  sharedUser=sharedAuth.currentUser;return true;
 }catch(e){console.error('Firebase init',e);return false}
}
function clearSharedListeners(){sharedUnsubs.forEach(fn=>{try{fn()}catch(e){}});sharedUnsubs=[]}

 <input id="giftShop" class="full" maxlength="80" placeholder="店名，例如：福砂屋／博多通りもん機場店">
 <input id="giftName" class="full" maxlength="80" placeholder="品項，例如：明太子仙貝" required>
 <select id="giftPriority"><option value="must">🔴 必買</option><option value="high">🟠 優先</option><option value="normal" selected>🔵 普通</option><option value="low">⚪ 有看到再買</option></select>
 <select id="giftType"><option value="split" selected>🎁 分送</option><option value="single">📦 一次送</option></select>
 <input id="giftQty" type="number" min="1" value="1" placeholder="數量">
 <input id="giftBudget" type="number" min="0" step="1" placeholder="預算 ¥">
 <input id="giftNote" class="full" maxlength="120" placeholder="備註，例如：不要酒類／機場最後補買">
 <button class="add-btn full" style="padding:11px">＋ 新增伴手禮</button></form><div id="giftSummary" class="gift-summary"></div><div id="giftList" class="gift-list-by-recipient"><div class="list-empty">${firebaseConfigured()?'正在連線…':'Firebase 連線後即可共同新增編輯'}</div></div><div id="giftPurchaseTotals" class="purchase-totals"></div></div></section>`;
 if(ok)subscribeGifts()
}
function priorityLabel(v){return ({must:'必買',high:'優先',normal:'普通',low:'有看到再買'})[v]||'普通'}
function giftTypeLabel(v){return v==='single'?'一次送':'分送'}
async function addGift(e){e.preventDefault();if(!await ensureFirebase())return alert('尚未設定 Firebase');const name=document.getElementById('giftName').value.trim();const recipient=document.getElementById('giftRecipient').value.trim();if(!name||!recipient)return;const data={recipient,shop:document.getElementById('giftShop').value.trim(),name,priority:document.getElementById('giftPriority').value||'normal',giftType:document.getElementById('giftType').value||'split',qty:Number(document.getElementById('giftQty').value)||1,budget:Number(document.getElementById('giftBudget').value)||0,note:document.getElementById('giftNote').value.trim(),done:false,createdAt:firebase.firestore.FieldValue.serverTimestamp(),updatedAt:firebase.firestore.FieldValue.serverTimestamp(),uid:sharedUser.uid};await giftsRef().add(data);e.target.reset();document.getElementById('giftQty').value=1;document.getElementById('giftPriority').value='normal';document.getElementById('giftType').value='split'}
function subscribeGifts(){const badge=document.getElementById('syncBadge');if(badge){badge.className='sync-badge live';badge.textContent='● 即時同步中'};const unsub=giftsRef().orderBy('createdAt','asc').onSnapshot(s=>{const el=document.getElementById('giftList');if(!el)return;const rows=s.docs.map(d=>({id:d.id,...d.data()}));el.innerHTML=rows.length?giftGroupsHTML(rows):'<div class="list-empty">目前沒有伴手禮，從上方新增第一個吧。</div>';renderGiftSummary(rows);renderGiftPurchaseTotals(rows)},e=>console.error(e));sharedUnsubs.push(unsub)}
function giftGroupsHTML(rows){const rank={must:0,high:1,normal:2,low:3};const groups={};rows.forEach(x=>{const recipient=(x.recipient||'').trim()||'未指定對象';(groups[recipient]||(groups[recipient]=[])).push(x)});return Object.entries(groups).sort((a,b)=>a[0].localeCompare(b[0],'zh-Hant')).map(([recipient,items])=>{items.sort((a,b)=>{const p=(rank[a.priority||'normal']??2)-(rank[b.priority||'normal']??2);return p||String(a.name||'').localeCompare(String(b.name||''),'zh-Hant')});const done=items.filter(x=>x.done).length;const qty=items.reduce((n,x)=>n+(Number(x.qty)||1),0);return `<section class="recipient-group"><div class="recipient-head"><div class="recipient-head-left"><b>👤 ${esc(recipient)}</b><small>${done}/${items.length} 項完成 · 預計 ${qty} 件</small></div><span class="recipient-count">${items.length} 項</span></div><div class="recipient-items">${items.map(giftHTML).join('')}</div></section>`}).join('')}
function renderGiftPurchaseTotals(rows){const el=document.getElementById('giftPurchaseTotals');if(!el)return;if(!rows.length){el.innerHTML='';return}const map={};let total=0,bought=0;rows.forEach(x=>{const name=(x.name||'未命名品項').trim()||'未命名品項',qty=Math.max(1,Number(x.qty)||1);total+=qty;if(x.done)bought+=qty;if(!map[name])map[name]={name,planned:0,bought:0,shops:new Set()};map[name].planned+=qty;if(x.done)map[name].bought+=qty;const shop=(x.shop||x.place||'').trim();if(shop)map[name].shops.add(shop)});const items=Object.values(map).sort((a,b)=>(b.planned-b.bought)-(a.planned-a.bought)||b.planned-a.planned||a.name.localeCompare(b.name,'zh-Hant'));el.innerHTML=`<div class="purchase-totals-head"><div><div class="eyebrow">PURCHASE TOTAL</div><h3>🧮 要購買的品項總量</h3></div><small>相同品項自動合併</small></div><div class="purchase-total-kpis"><div><b>${total}</b><small>預計總數量</small></div><div><b>${bought}</b><small>已買數量</small></div><div><b>${Math.max(0,total-bought)}</b><small>待買數量</small></div></div><div class="purchase-item-list">${items.map(i=>{const remain=Math.max(0,i.planned-i.bought),shops=[...i.shops];return `<div class="purchase-item-row"><div><b>${esc(i.name)}</b><small>${shops.length?'店名：'+esc(shops.join('／')):'尚未指定店名'}</small></div><div class="purchase-item-qty"><strong>× ${i.planned}</strong><span>${remain?`待買 ${remain}`:'✓ 已完成'}</span></div></div>`}).join('')}</div>`}
function giftHTML(x){const priority=x.priority||'normal',giftType=x.giftType||'split',shop=x.shop||x.place||'',recipient=x.recipient||'';const meta=[shop?`店名：${esc(shop)}`:'',`數量 ${x.qty||1}`,x.budget?`預算 ¥${Number(x.budget).toLocaleString()}`:'',x.note?esc(x.note):''].filter(Boolean).join(' · ');return `<div class="gift-item ${x.done?'done':''}"><input type="checkbox" ${x.done?'checked':''} onchange="toggleGift('${x.id}',this.checked)"><div><div class="gift-name">${esc(x.name)}</div><div class="gift-tags"><span class="gift-tag priority-${priority}">${priorityLabel(priority)}</span><span class="gift-tag type">${giftTypeLabel(giftType)}</span></div><div class="gift-meta">${meta||'尚未填寫購買資訊'}</div><div id="gedit-${x.id}" class="hidden"><div class="gift-form" style="margin-top:9px"><input id="grecipient-${x.id}" class="full" value="${esc(recipient)}" placeholder="要送的人"><input id="gshop-${x.id}" class="full" value="${esc(shop)}" placeholder="店名"><input id="gname-${x.id}" class="full" value="${esc(x.name)}" placeholder="品項"><select id="gpriority-${x.id}"><option value="must" ${priority==='must'?'selected':''}>🔴 必買</option><option value="high" ${priority==='high'?'selected':''}>🟠 優先</option><option value="normal" ${priority==='normal'?'selected':''}>🔵 普通</option><option value="low" ${priority==='low'?'selected':''}>⚪ 有看到再買</option></select><select id="gtype-${x.id}"><option value="split" ${giftType==='split'?'selected':''}>🎁 分送</option><option value="single" ${giftType==='single'?'selected':''}>📦 一次送</option></select><input id="gqty-${x.id}" type="number" min="1" value="${Number(x.qty)||1}" placeholder="數量"><input id="gbudget-${x.id}" type="number" min="0" value="${Number(x.budget)||0}" placeholder="預算 ¥"><input id="gnote-${x.id}" class="full" value="${esc(x.note||'')}" placeholder="備註"><button class="add-btn full" type="button" style="padding:10px" onclick="saveGiftEdit('${x.id}')">儲存修改</button></div></div></div><div class="shared-actions"><button class="icon-btn" onclick="document.getElementById('gedit-${x.id}').classList.toggle('hidden')">✏️</button><button class="icon-btn" onclick="deleteGift('${x.id}')">🗑️</button></div></div>`}
function renderGiftSummary(rows){const el=document.getElementById('giftSummary');if(!el)return;const done=rows.filter(x=>x.done).length,budget=rows.reduce((a,x)=>a+(Number(x.budget)||0)*(Number(x.qty)||1),0);el.innerHTML=`<div><b>${rows.length}</b><small>預計品項</small></div><div><b>${done}</b><small>已購買</small></div><div><b>¥${budget.toLocaleString()}</b><small>估計預算</small></div>`}
async function toggleGift(id,done){if(await ensureFirebase())await giftsRef().doc(id).update({done,updatedAt:firebase.firestore.FieldValue.serverTimestamp()})}
async function saveGiftEdit(id){const name=document.getElementById('gname-'+id),recipient=document.getElementById('grecipient-'+id);if(!name||!name.value.trim()||!recipient||!recipient.value.trim())return alert('請填寫對象與品項');if(await ensureFirebase())await giftsRef().doc(id).update({recipient:recipient.value.trim(),shop:(document.getElementById('gshop-'+id)?.value||'').trim(),name:name.value.trim(),priority:document.getElementById('gpriority-'+id)?.value||'normal',giftType:document.getElementById('gtype-'+id)?.value||'split',qty:Number(document.getElementById('gqty-'+id)?.value)||1,budget:Number(document.getElementById('gbudget-'+id)?.value)||0,note:(document.getElementById('gnote-'+id)?.value||'').trim(),updatedAt:firebase.firestore.FieldValue.serverTimestamp()})}
async function deleteGift(id){if(confirm('刪除這個伴手禮項目？')&&await ensureFirebase())await giftsRef().doc(id).delete()}
function setPage(day,scroll=true){currentPage=String(day);document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.day===String(day)));clearSharedListeners();if(day==='home')home();else if(day==='checklist')checklistPage();else if(day==='gifts')giftsPage();else dayPage(Number(day));if(scroll)window.scrollTo({top:0,behavior:'smooth'})}
function markTodayNav(){const td=tripDayToday();document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('today',td&&b.dataset.day===String(td)))}
function updateCountdown(){const now=new Date(),start=new Date('2026-09-09T08:00:00+08:00'),end=new Date('2026-09-13T13:45:00+08:00');let txt='';if(now<start){const d=Math.ceil((start-now)/86400000);txt=`距離出發約 ${d} 天｜9/6 產檢＋MEDIF`}else if(now>end){txt='旅程已完成，這份頁面就是我們的福岡旅行紀錄 ✨'}else{const td=tripDayToday();txt=td?`旅行進行中｜今天是 Day ${td}，只完成主任務也很棒 👍`:'旅行進行中｜慢慢走、休息優先'}document.getElementById('countdown').textContent=txt}
function openPhoto(src,alt){const m=document.getElementById('photoModal'),im=document.getElementById('modalImage');im.src=src;im.alt=alt||'照片';m.classList.add('show');document.body.style.overflow='hidden'}
function closePhoto(e){if(e&&e.target.id==='modalImage')return;document.getElementById('photoModal').classList.remove('show');document.body.style.overflow=''}
document.querySelectorAll('.nav-btn').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.day)));
try{updateCountdown();markTodayNav();loadFukuokaWeather();const td=tripDayToday();td?setPage(td,false):setPage('home',false);setInterval(()=>{updateCountdown();markTodayNav();if(tripDayToday()&&/^\d$/.test(currentPage)&&currentPage===String(tripDayToday()))dayPage(Number(currentPage))},60000)}catch(err){console.error(err);content.innerHTML='<div class="notice danger">頁面載入失敗，請重新整理或重新上傳最新版 index.html。</div>'}
</script>
