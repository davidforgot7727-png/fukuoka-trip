function nextStopInfo(){
 const td=tripDayToday();
 if(!td){const before=new Date()<new Date('2026-09-09T00:00:00+09:00');const d=before?1:5;return {day:d,event:before?eventsForDay(1)[0]:eventsForDay(5).at(-1),label:before?'旅程第一站':'旅程已結束',minutes:null}}
 const evs=eventsForDay(td),now=jpNow().min;let upcoming=null;
 for(const e of evs){const st=eventStartMinutesJP(e);if(st!==null&&st>now){upcoming={event:e,minutes:st-now};break}}
 if(upcoming)return {day:td,event:upcoming.event,label:'下一站',minutes:upcoming.minutes};
 const idx=currentEventIndex(td,evs);return {day:td,event:evs[Math.max(0,idx)],label:'目前行程',minutes:null}
}
function minsText(m){if(m==null)return '';if(m<60)return `${m} 分鐘後`;const h=Math.floor(m/60),r=m%60;return r?`${h} 小時 ${r} 分後`:`${h} 小時後`}
function nextStopCardHTML(){const n=nextStopInfo(),e=n.event;if(!e)return '';const map=e.map||'';return `<section class="section"><div class="section-head"><div><div class="eyebrow">RIGHT NOW</div><h2>現在最重要</h2></div></div><div class="next-stop-card"><div class="next-stop-top"><div><div class="next-stop-kicker">${n.label} · DAY ${n.day}</div></div>${n.minutes!=null?`<div class="next-stop-count">⏱ ${minsText(n.minutes)}</div>`:''}</div><div class="next-stop-body"><div class="next-stop-time">${esc(e.time)}</div><div class="next-stop-title">${esc(e.title)}</div><div class="next-stop-desc">${esc(e.desc||'')}</div><div class="next-stop-actions">${mapBtn(map)}${map?`<a class="btn dark" href="${UBER_ANDROID_LINK}">🚕 Uber</a>`:''}<button class="btn" onclick="openTripDay(${n.day})">🗓️ 看今日行程</button></div></div></div></section>`}

function photoBlock(e){if(!e.img||e.img.startsWith('https://r.gnavi.co.jp/b1mjkkgz0000/menu3/'))return '';const srcLink=e.source||e.photoUrl||'';return `<div class="event-photo"><img src="${e.img}" alt="${e.tag||e.title}" loading="lazy" referrerpolicy="no-referrer" onclick="openPhoto(this.src,this.alt)" onerror="imageFallback(this)">${e.tag?`<span class="photo-tag">${e.tag}</span>`:''}${srcLink?`<a class="top-chip" href="${srcLink}" target="_blank" rel="noopener">照片來源 ↗</a>`:''}</div>`}
function categoryLabel(v){return ({main:'主任務',bonus:'Bonus',rest:'休息',meal:'用餐',transport:'交通',other:'其他'})[v]||''}
function renderEvents(day,events){const cur=currentEventIndex(day,events),canEdit=authUserOK(),mode=itineraryModeForDay(day);if(!events.length)return '<div class="itinerary-empty">這個行程目前沒有項目。登入家人帳號後可按「＋ 新增行程」。</div>';return `<div class="timeline">${events.map((e,i)=>`<article class="event ${i===cur?'current-event':''}">${photoBlock(e)}<div class="event-body"><div class="event-time">${esc(e.time||'時間未定')}${e.category?`<span class="event-category">${esc(categoryLabel(e.category))}</span>`:''}</div><div class="event-title">${esc(e.title||'未命名行程')}</div>${e.location?`<div class="event-location">📍 ${esc(e.location)}</div>`:''}<div class="event-desc">${esc(e.desc||'')}</div><div class="actions">${mapBtn(e.map)}${String(e.title||'').includes('🚕')?taxiBtns():''}</div>${canEdit&&e._id?`<div class="event-edit-actions"><button class="move" onclick="moveItineraryEvent('${e._id}',-1)" ${i===0?'disabled':''}>↑ 上移</button><button class="move" onclick="moveItineraryEvent('${e._id}',1)" ${i===events.length-1?'disabled':''}>↓ 下移</button><button onclick="openItineraryEditor(${day},'${mode}','${e._id}')">✏️ 修改</button><button onclick="copyItineraryEvent('${e._id}')">📋 複製</button><button class="delete" onclick="deleteItineraryEvent('${e._id}')">🗑️ 刪除</button></div>${e.editorName?`<div class="event-editor-by">最後修改：${esc(e.editorName)}</div>`:''}`:''}</div></article>`).join('')}</div>`}
function dayCover(n,d){return `<section class="day-cover"><img src="${d.cover}" alt="${d.coverTag}" referrerpolicy="no-referrer" onerror="imageFallback(this)"><a class="top-chip" href="${d.source}" target="_blank" rel="noopener">真實照片 ↗</a><div class="day-cover-content"><div class="day-num">DAY ${n} · ${d.date}</div><h2>${d.theme}</h2><p>${dayRule(n)}</p>${tripDayToday()===n?'<span class="today-ribbon">✨ 今天行程</span>':''}</div></section>`}
function dayRule(n){return n===1?'第一天不硬撐，16:30 後隨時可撤。':n===2?'麵包超人是主任務，櫛田神社是 Bonus。':n===3?'11:00 海豚秀＋午餐，午後回飯店。':n===4?'大濠看天氣；敘敘苑＋岩田屋是穩定主線。':'提早到機場，免稅有時間再逛。'}

function itineraryRef(){return sharedDb.collection('trips').doc(SHARED_TRIP_ID).collection('itinerary')}
function itineraryBackupRef(day,mode){return sharedDb.collection('trips').doc(SHARED_TRIP_ID).collection('itineraryBackups').doc(`d${day}-${mode}`)}
function inferEventCategory(e){const t=String(e?.title||'');if(/🍴|🍚|🍳|🥩|🍲|🍜|午餐|晚餐|早餐/.test(t))return 'meal';if(/😴|休息|午睡/.test(t))return 'rest';if(/🚕|🚇|✈️|🛫|🚪|出發|前往|抵達|退房/.test(t))return 'transport';if(/Optional|Bonus|體力好/.test(t))return 'bonus';return 'main'}
function defaultItineraryRows(){const rows=[];for(let day=1;day<=5;day++){for(const mode of (day===4?['sun','rain']:['sun'])){defaultEventsForDay(day,mode).forEach((e,i)=>rows.push({...e,day,mode,order:(i+1)*100,category:e.category||inferEventCategory(e)}))}}return rows}
function plainItineraryItem(x){const o={};['day','mode','order','time','tz','title','location','desc','map','img','tag','source','category'].forEach(k=>{if(x?.[k]!==undefined&&x?.[k]!==null&&x?.[k]!=='')o[k]=x[k]});return o}
async function seedItineraryIfNeeded(){if(itinerarySeedPromise)return itinerarySeedPromise;itinerarySeedPromise=(async()=>{if(!await ensureFirebase())return false;try{const snap=await itineraryRef().limit(1).get();if(!snap.empty)return true;const rows=defaultItineraryRows(),batch=sharedDb.batch();rows.forEach((x,i)=>{const id=`d${x.day}-${x.mode}-${String(i+1).padStart(3,'0')}`;batch.set(itineraryRef().doc(id),{...plainItineraryItem(x),createdAt:firebase.firestore.FieldValue.serverTimestamp(),updatedAt:firebase.firestore.FieldValue.serverTimestamp(),uid:sharedUser.uid,editorName:getEditorName()})});await batch.commit();return true}catch(e){console.warn('seed itinerary',e);return false}})();try{return await itinerarySeedPromise}finally{itinerarySeedPromise=null}}
async function startItinerarySync(){if(itineraryUnsub||itineraryStarting)return;itineraryStarting=true;try{if(!await ensureFirebase())return;await seedItineraryIfNeeded();if(itineraryUnsub)return;itineraryUnsub=itineraryRef().onSnapshot(s=>{itineraryRowsCache=s.docs.map(d=>({_id:d.id,...d.data()}));itineraryLoaded=true;if(currentPage==='trip')dayPage(selectedTripDay);else if(currentPage==='home')home()},e=>console.warn('itinerary sync',e))}finally{itineraryStarting=false}}
function stopItinerarySync(){if(itineraryUnsub){try{itineraryUnsub()}catch(e){}itineraryUnsub=null}itineraryStarting=false;itineraryRowsCache=[];itineraryLoaded=false}
function itineraryEditorToolbarHTML(day,mode){if(!authUserOK())return `<div class="itinerary-login-note">${authGateHTML('行程編輯')}</div>`;const dis=itineraryLoaded?'':'disabled';return `<div class="itinerary-editor-toolbar"><button class="it-btn primary" ${dis} onclick="openItineraryEditor(${day},'${mode}')">＋ 新增行程</button><button class="it-btn" ${dis} onclick="restoreLastItineraryBackup(${day},'${mode}')">↩ 最近備份</button><button class="it-btn" ${dis} onclick="restoreOriginalItinerary(${day},'${mode}')">♻️ 還原原始</button><span class="itinerary-sync-note ${itineraryLoaded?'live':''}">${itineraryLoaded?'● 行程已同步':'○ 正在建立／同步行程'}</span></div><div class="itinerary-backup-note">每次新增／修改／刪除／排序前，都會自動保存這一天目前的行程作為「最近備份」。</div>`}
function itineraryFormHTML(day,mode){return `<div id="itineraryFormCard" class="itinerary-form-card hidden"><div class="itinerary-form-head"><div><b id="itineraryFormTitle">新增行程</b><small>Day ${day}${day===4?` · ${mode==='rain'?'雨天':'晴天'}`:''}</small></div><button type="button" class="itinerary-close" onclick="closeItineraryEditor()">×</button></div><form class="itinerary-form" onsubmit="submitItineraryForm(event)"><div class="itinerary-form-grid"><div class="itinerary-field"><label>🕐 時間</label><input id="itTime" maxlength="40" placeholder="例如 10:30–11:30" required></div><div class="itinerary-field"><label>🌏 時區</label><select id="itTz"><option value="JP">日本</option><option value="TW">台灣</option></select></div></div><div class="itinerary-field"><label>✨ 行程標題</label><input id="itTitle" maxlength="100" placeholder="例如：🍴 午餐｜博多拉麵" required></div><div class="itinerary-form-grid two"><div class="itinerary-field"><label>📍 地點</label><input id="itLocation" maxlength="100" placeholder="LaLaport Fukuoka"></div><div class="itinerary-field"><label>🏷️ 類型</label><select id="itCategory"><option value="main">主任務</option><option value="transport">交通</option><option value="meal">用餐</option><option value="rest">休息</option><option value="bonus">Bonus</option><option value="other">其他</option></select></div></div><div class="itinerary-field"><label>📝 說明</label><textarea id="itDesc" maxlength="500" placeholder="注意事項、集合方式、備註…"></textarea></div><div class="itinerary-field"><label>🗺️ Google Maps 連結</label><input id="itMap" type="url" placeholder="https://www.google.com/maps/..."></div><div class="itinerary-form-grid two"><div class="itinerary-field"><label>🖼️ 圖片網址（選填）</label><input id="itImg" type="url" placeholder="https://..."></div><div class="itinerary-field"><label>🏷️ 圖片標籤（選填）</label><input id="itTag" maxlength="60" placeholder="景點照片"></div></div><div class="itinerary-form-actions"><button id="itinerarySaveBtn" class="itinerary-save" type="submit">＋ 新增行程</button><button class="itinerary-cancel" type="button" onclick="closeItineraryEditor()">取消</button></div></form></div>`}
function closeItineraryEditor(){itineraryEditId=null;itineraryEditDay=null;const card=document.getElementById('itineraryFormCard');if(card)card.classList.add('hidden')}
function findItineraryRow(id){return itineraryRowsCache.find(x=>x._id===id)}
function openItineraryEditor(day,mode,id=''){if(!authUserOK())return signInGoogle();itineraryEditId=id||null;itineraryEditDay=Number(day);itineraryEditMode=mode||'sun';const card=document.getElementById('itineraryFormCard');if(!card){dayPage(day);return setTimeout(()=>openItineraryEditor(day,mode,id),0)}card.classList.remove('hidden');const row=id?findItineraryRow(id):null;document.getElementById('itineraryFormTitle').textContent=row?'修改行程':'新增行程';document.getElementById('itinerarySaveBtn').textContent=row?'✓ 儲存修改':'＋ 新增行程';document.getElementById('itTime').value=row?.time||'';document.getElementById('itTz').value=row?.tz||((day===1&&/台灣/.test(row?.time||''))?'TW':'JP');document.getElementById('itTitle').value=row?.title||'';document.getElementById('itLocation').value=row?.location||'';document.getElementById('itCategory').value=row?.category||inferEventCategory(row||{});document.getElementById('itDesc').value=row?.desc||'';document.getElementById('itMap').value=row?.map||'';document.getElementById('itImg').value=row?.img||'';document.getElementById('itTag').value=row?.tag||'';requestAnimationFrame(()=>card.scrollIntoView({behavior:'smooth',block:'center'}))}
function currentModeRows(day,mode){const cached=cachedItineraryEvents(day,mode);return cached===null?defaultEventsForDay(day,mode).map((x,i)=>({...x,day,mode,order:(i+1)*100,category:x.category||inferEventCategory(x)})):cached}
async function backupItinerary(day,mode,reason='修改前'){if(!await ensureFirebase())return false;const items=currentModeRows(day,mode).map(plainItineraryItem);await itineraryBackupRef(day,mode).set({day,mode,items,reason,updatedAt:firebase.firestore.FieldValue.serverTimestamp(),uid:sharedUser.uid,editorName:getEditorName()});return true}
async function submitItineraryForm(e){e.preventDefault();if(!await ensureFirebase())return alert('請先使用家人 Google 帳號登入');const day=itineraryEditDay||selectedTripDay,mode=itineraryEditMode||itineraryModeForDay(day);await backupItinerary(day,mode,itineraryEditId?'修改行程前':'新增行程前');const current=itineraryEditId?findItineraryRow(itineraryEditId):null,rows=currentModeRows(day,mode);const data={day,mode,time:document.getElementById('itTime').value.trim(),tz:document.getElementById('itTz').value||'JP',title:document.getElementById('itTitle').value.trim(),location:document.getElementById('itLocation').value.trim(),category:document.getElementById('itCategory').value||'main',desc:document.getElementById('itDesc').value.trim(),map:document.getElementById('itMap').value.trim(),img:document.getElementById('itImg').value.trim(),tag:document.getElementById('itTag').value.trim(),order:current?.order??((rows.length?Math.max(...rows.map(x=>Number(x.order)||0)):0)+100),updatedAt:firebase.firestore.FieldValue.serverTimestamp(),uid:sharedUser.uid,editorName:getEditorName()};if(itineraryEditId)await itineraryRef().doc(itineraryEditId).update(data);else await itineraryRef().add({...data,createdAt:firebase.firestore.FieldValue.serverTimestamp()});closeItineraryEditor()}
async function deleteItineraryEvent(id){const x=findItineraryRow(id);if(!x||!confirm(`刪除「${x.title}」？\n刪除前會自動建立最近備份。`))return;if(!await ensureFirebase())return;await backupItinerary(x.day,x.mode||'sun','刪除行程前');await itineraryRef().doc(id).delete()}
async function copyItineraryEvent(id){const x=findItineraryRow(id);if(!x||!await ensureFirebase())return;await backupItinerary(x.day,x.mode||'sun','複製行程前');const rows=currentModeRows(x.day,x.mode||'sun'),idx=rows.findIndex(r=>r._id===id),next=rows[idx+1];const order=next?((Number(x.order)||0)+(Number(next.order)||0))/2:(Number(x.order)||0)+50;const data=plainItineraryItem({...x,order,title:`${x.title}（複製）`});delete data._id;await itineraryRef().add({...data,createdAt:firebase.firestore.FieldValue.serverTimestamp(),updatedAt:firebase.firestore.FieldValue.serverTimestamp(),uid:sharedUser.uid,editorName:getEditorName()})}
async function moveItineraryEvent(id,dir){const x=findItineraryRow(id);if(!x||!await ensureFirebase())return;const rows=currentModeRows(x.day,x.mode||'sun'),idx=rows.findIndex(r=>r._id===id),target=rows[idx+Number(dir)];if(!target||!target._id)return;await backupItinerary(x.day,x.mode||'sun','調整行程順序前');const batch=sharedDb.batch(),a=Number(x.order)||((idx+1)*100),b=Number(target.order)||((idx+1+Number(dir)+1)*100);batch.update(itineraryRef().doc(x._id),{order:b,updatedAt:firebase.firestore.FieldValue.serverTimestamp(),uid:sharedUser.uid,editorName:getEditorName()});batch.update(itineraryRef().doc(target._id),{order:a,updatedAt:firebase.firestore.FieldValue.serverTimestamp(),uid:sharedUser.uid,editorName:getEditorName()});await batch.commit()}
async function replaceItineraryMode(day,mode,items){if(!await ensureFirebase())return;const rows=currentModeRows(day,mode),batch=sharedDb.batch();rows.filter(x=>x._id).forEach(x=>batch.delete(itineraryRef().doc(x._id)));items.forEach((raw,i)=>{const ref=itineraryRef().doc();const x={...plainItineraryItem(raw),day,mode,order:(i+1)*100,updatedAt:firebase.firestore.FieldValue.serverTimestamp(),createdAt:firebase.firestore.FieldValue.serverTimestamp(),uid:sharedUser.uid,editorName:getEditorName()};batch.set(ref,x)});await batch.commit()}

function weatherInfo(code){
 const c=Number(code);
 if(c===0)return {icon:'☀️',text:'晴朗'};
 if([1,2].includes(c))return {icon:'🌤️',text:c===1?'大致晴朗':'局部多雲'};
 if(c===3)return {icon:'☁️',text:'多雲'};
 if([45,48].includes(c))return {icon:'🌫️',text:'霧'};
 if([51,53,55,56,57].includes(c))return {icon:'🌦️',text:'毛毛雨'};
 if([61,63,65,66,67].includes(c))return {icon:'🌧️',text:'下雨'};
 if([71,73,75,77,85,86].includes(c))return {icon:'🌨️',text:'降雪'};
 if([80,81,82].includes(c))return {icon:'🌦️',text:'陣雨'};
 if([95,96,99].includes(c))return {icon:'⛈️',text:'雷雨'};
 return {icon:'🌤️',text:'天氣變化'};
}
let latestWeatherData=null;
function weatherAdvice(d){
 const h=d.hourly||{},times=h.time||[],pops=h.precipitation_probability||[],codes=h.weather_code||[];const now=Date.now();let maxPop=0,rainSoon=false;
 times.forEach((t,i)=>{const ms=new Date(t+'+09:00').getTime();if(ms>=now&&ms<=now+6*3600000){maxPop=Math.max(maxPop,Number(pops[i]||0));if([51,53,55,56,57,61,63,65,66,67,80,81,82,95,96,99].includes(Number(codes[i])))rainSoon=true}});
 if(rainSoon||maxPop>=60)return {type:'rain',text:`接下來 6 小時最高降雨機率 ${maxPop}%｜雨具隨身，戶外行程保留彈性。`};
 if(maxPop>=35)return {type:'watch',text:`接下來 6 小時最高降雨機率 ${maxPop}%｜建議隨身帶傘。`};
 return {type:'ok',text:`接下來 6 小時降雨風險較低（最高 ${maxPop}%），仍注意 9 月高溫與補水。`}
}
function hourlyForecastHTML(d){const h=d.hourly||{},times=h.time||[],temps=h.temperature_2m||[],pops=h.precipitation_probability||[],codes=h.weather_code||[];const now=Date.now();const rows=[];for(let i=0;i<times.length&&rows.length<6;i++){const ms=new Date(times[i]+'+09:00').getTime();if(ms>=now-1800000){const wi=weatherInfo(codes[i]);rows.push(`<div class="hourly-item"><div class="time">${times[i].slice(11,16)}</div><div class="icon">${wi.icon}</div><div class="temp">${Math.round(temps[i])}°</div><div class="pop">☔ ${Number(pops[i]||0)}%</div></div>`)}}const advice=weatherAdvice(d),td=tripDayToday();const day4Btn=(td===4&&advice.type==='rain'&&day4Mode()!=='rain')?`<button onclick="day4ModeSwitch('rain');setPage('trip')">切雨天版</button>`:'';return `<div class="hourly-head"><div><b>🌤️ 福岡未來幾小時</b><small>日本時間 · 每次開啟自動更新</small></div><button class="weather-refresh" onclick="loadFukuokaWeather(true)">↻ 更新</button></div><div class="hourly-strip">${rows.join('')}</div><div class="weather-advice">${advice.type==='rain'?'🌧️':advice.type==='watch'?'☂️':'🌤️'} ${advice.text}${day4Btn}</div>`}
async function loadFukuokaWeather(force=false){

 if(force&&el)el.innerHTML='<span class="hw-icon">⏳</span><div><div class="hw-temp">--°</div><div class="hw-text">更新中…</div></div>';

  const r=await fetch(FUKUOKA_WEATHER_URL,{cache:'no-store'});if(!r.ok)throw new Error('weather '+r.status);
  const d=await r.json();latestWeatherData=d;const c=d.current,w=weatherInfo(c.weather_code);const temp=Math.round(c.temperature_2m),feel=Math.round(c.apparent_temperature),hum=Math.round(c.relative_humidity_2m),rain=Number(c.precipitation||0);
  if(el)el.innerHTML=`<span class="hw-icon">${w.icon}</span><div><div class="hw-temp">${temp}°</div><div class="hw-text">${w.text} · 體感 ${feel}° · 濕度 ${hum}%${rain>0?' · '+rain+'mm':''}</div></div><button onclick="loadFukuokaWeather(true)" aria-label="更新福岡天氣">↻</button>`;

}
let sharedDb=null,sharedAuth=null,sharedUser=null,sharedUnsubs=[];
let firestorePersistenceAttempted=false,authObserverBound=false;
function firebaseConfigured(){return FIREBASE_CONFIG&&FIREBASE_CONFIG.apiKey&&FIREBASE_CONFIG.projectId&&FIREBASE_CONFIG.appId}
function normalizedFamilyEmails(){return FAMILY_EMAILS.map(x=>String(x||'').trim().toLowerCase()).filter(Boolean)}
function familyWhitelistConfigured(){return normalizedFamilyEmails().length>0}
function isFamilyEmail(email){const list=normalizedFamilyEmails();return !list.length||list.includes(String(email||'').trim().toLowerCase())}
function authUserOK(){return !!(sharedUser&&!sharedUser.isAnonymous&&sharedUser.email&&isFamilyEmail(sharedUser.email))}
async function initFirebase(){
 if(!firebaseConfigured())return false;
 try{
  if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);
  sharedAuth=firebase.auth();sharedDb=firebase.firestore();
  if(!firestorePersistenceAttempted){firestorePersistenceAttempted=true;try{await sharedDb.enablePersistence({synchronizeTabs:true})}catch(pErr){console.warn('Firestore offline persistence unavailable',pErr?.code||pErr)}}
  if(sharedAuth.currentUser?.isAnonymous){try{await sharedAuth.signOut()}catch(e){}}
  sharedUser=sharedAuth.currentUser&&!sharedAuth.currentUser?.isAnonymous?sharedAuth.currentUser:null;
  if(!authObserverBound){authObserverBound=true;sharedAuth.onAuthStateChanged(user=>{sharedUser=user&&!user.isAnonymous?user:null;if(authUserOK())startItinerarySync();else stopItinerarySync();if(['checklist','gifts','more','secure','trip','home'].includes(currentPage))setTimeout(()=>setPage(currentPage,false),0)})}
  try{await sharedAuth.getRedirectResult()}catch(e){if(e?.code)console.warn('Google redirect result',e.code)}
  sharedUser=sharedAuth.currentUser&&!sharedAuth.currentUser?.isAnonymous?sharedAuth.currentUser:null;
  return true;
 }catch(e){console.error('Firebase init',e);return false}
}
async function ensureFirebase(){if(!await initFirebase())return false;sharedUser=sharedAuth.currentUser&&!sharedAuth.currentUser?.isAnonymous?sharedAuth.currentUser:null;return authUserOK()}
function authSetupWarning(){return familyWhitelistConfigured()?'':`<div class="notice warn auth-setup-warning"><b>⚠️ Google 白名單尚未設定</b><br>目前是設定模式。正式分享前，請把家人的 Gmail 填入 <code>FAMILY_EMAILS</code>，並套用 ZIP 裡的 <code>firestore-secure.rules</code>。</div>`}
function authGateHTML(feature='共同功能'){const u=sharedUser;if(u&&!isFamilyEmail(u.email))return `<div class="auth-card denied"><div class="auth-avatar">⛔</div><div><b>此 Google 帳號未在家人白名單</b><small>${esc(u.email||'')} 無法使用 ${esc(feature)}</small></div><button class="auth-btn ghost" onclick="signOutGoogle()">換帳號</button></div>`;return `<div class="auth-card"><div class="auth-avatar">G</div><div><b>使用 Google 登入</b><small>登入後才能使用 ${esc(feature)}；行程與天氣仍可直接查看。</small></div><button class="auth-btn" onclick="signInGoogle()">Google 登入</button></div>`}

async function signInGoogle(){
 if(!await initFirebase())return alert('Firebase 尚未連線');
 const provider=new firebase.auth.GoogleAuthProvider();provider.setCustomParameters({prompt:'select_account'});
 try{const r=await sharedAuth.signInWithPopup(provider);sharedUser=r.user;if(sharedUser&&!isFamilyEmail(sharedUser.email))alert('這個 Google 帳號不在家人白名單。');else showNetworkToast('✓ Google 登入成功')}
 catch(e){console.warn('Google popup',e?.code||e);if(['auth/popup-blocked','auth/operation-not-supported-in-this-environment'].includes(e?.code)){try{await sharedAuth.signInWithRedirect(provider)}catch(rErr){alert('Google 登入失敗：'+(rErr?.message||rErr))}}else if(e?.code!=='auth/popup-closed-by-user')alert('Google 登入失敗：'+(e?.message||e))}
}

function giftEditorIsCollapsed(){return document.getElementById('giftEditor')?.classList.contains('collapsed')??true}
function setGiftEditorCollapsed(collapsed,save=true){const card=document.getElementById('giftEditor'),btn=document.getElementById('giftCollapseBtn');if(!card)return;card.classList.toggle('collapsed',!!collapsed);if(btn)btn.textContent=collapsed?'展開 ▼':'收合 ▲';if(save)try{localStorage.setItem('fukuokaGiftEditorCollapsed',collapsed?'1':'0')}catch(e){}}

function toggleGiftEditor(){setGiftEditorCollapsed(!giftEditorIsCollapsed())}
function openGiftEditor(){setGiftEditorCollapsed(false);requestAnimationFrame(()=>document.getElementById('giftEditor')?.scrollIntoView({behavior:'smooth',block:'start'}))}
function priorityLabel(v){return ({must:'必買',high:'優先',normal:'普通',low:'有看到再買'})[v]||'普通'}

function setGiftChoice(kind,value){const hidden=document.getElementById(kind==='priority'?'giftPriority':'giftType');if(hidden)hidden.value=value;document.querySelectorAll(`[data-choice="${kind}"]`).forEach(b=>b.classList.toggle('active',b.dataset.value===value))}
function uniqueGiftValues(field){return [...new Set(giftRowsCache.map(x=>String(x[field]||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'zh-Hant'))}
function renderGiftSuggestions(){[['giftRecipientList','recipient'],['giftShopList','shop'],['giftNameList','name']].forEach(([id,field])=>{const el=document.getElementById(id);if(el)el.innerHTML=uniqueGiftValues(field).map(v=>`<option value="${esc(v)}"></option>`).join('')})}
function renderGiftPresets(rows){const el=document.getElementById('giftPresets');if(!el)return;if(!rows.length){el.innerHTML='';return}const seen=new Set(),items=[];[...rows].reverse().forEach(x=>{const key=`${x.recipient||''}|${x.name||''}|${x.shop||''}`;if(!seen.has(key)&&items.length<6){seen.add(key);items.push(x)}});el.innerHTML=`<div class="gift-presets-head"><b>✨ 快速帶入已填資料</b><small>點一下，填入上方表單後可再修改</small></div><div class="gift-preset-list">${items.map(x=>`<button type="button" class="gift-preset" onclick="loadGiftPreset('${x.id}')"><b>${esc(x.name||'待補品項')}</b><small>👤 ${esc(x.recipient||'未指定')}${x.shop?' · '+esc(x.shop):''}</small></button>`).join('')}</div>`}
function fillGiftForm(x){document.getElementById('giftRecipient').value=x.recipient||'';document.getElementById('giftShop').value=x.shop||x.place||'';document.getElementById('giftName').value=x.name||'';document.getElementById('giftQty').value=Math.max(1,Number(x.qty)||1);document.getElementById('giftBudget').value=Number(x.budget)||'';document.getElementById('giftNote').value=x.note||'';setGiftChoice('priority',x.priority||'normal');setGiftChoice('type',x.giftType||'split')}
function resetGiftForm(){giftEditingId=null;const form=document.getElementById('giftForm');if(form)form.reset();const qty=document.getElementById('giftQty');if(qty)qty.value=1;setGiftChoice('priority','normal');setGiftChoice('type','split');const title=document.getElementById('giftFormTitle'),eye=document.getElementById('giftFormEyebrow'),btn=document.getElementById('giftSubmitBtn'),cancel=document.getElementById('giftCancelBtn'),card=document.getElementById('giftEditor');if(title)title.textContent='新增伴手禮';if(eye)eye.textContent='NEW SOUVENIR';if(btn)btn.textContent='＋ 新增伴手禮';if(cancel)cancel.classList.add('hidden');if(card)card.classList.remove('editing')}
function editGift(id){const x=giftRowsCache.find(r=>r.id===id);if(!x)return;expandRecipientByName((x.recipient||'').trim()||'未指定對象');giftEditingId=id;fillGiftForm(x);const title=document.getElementById('giftFormTitle'),eye=document.getElementById('giftFormEyebrow'),btn=document.getElementById('giftSubmitBtn'),cancel=document.getElementById('giftCancelBtn'),card=document.getElementById('giftEditor');if(title)title.textContent='編輯伴手禮';if(eye)eye.textContent='EDIT SOUVENIR';if(btn)btn.textContent='✓ 儲存修改';if(cancel)cancel.classList.remove('hidden');if(card)card.classList.add('editing');openGiftEditor()}

async function submitGiftForm(e){e.preventDefault();if(!await ensureFirebase())return alert('請先使用 Google 登入家人帳號');const name=document.getElementById('giftName').value.trim(),recipient=document.getElementById('giftRecipient').value.trim();if(!recipient)return alert('請先填寫「要送的人」');const hasItem=!!name;const data={recipient,shop:document.getElementById('giftShop').value.trim(),name,priority:document.getElementById('giftPriority').value||'normal',giftType:document.getElementById('giftType').value||'split',qty:hasItem?(Number(document.getElementById('giftQty').value)||1):0,budget:Number(document.getElementById('giftBudget').value)||0,note:document.getElementById('giftNote').value.trim(),draft:!hasItem,updatedAt:firebase.firestore.FieldValue.serverTimestamp(),uid:sharedUser.uid,editorName:getEditorName()};if(giftEditingId){await giftsRef().doc(giftEditingId).update(data)}else{await giftsRef().add({...data,done:false,createdAt:firebase.firestore.FieldValue.serverTimestamp()})}resetGiftForm()}
const RECIPIENT_COLLAPSE_KEY='fukuokaRecipientCollapseV3';
function recipientCollapseState(){try{return JSON.parse(localStorage.getItem(RECIPIENT_COLLAPSE_KEY)||'{}')||{}}catch(e){return {}}}
function recipientIsCollapsed(name){const state=recipientCollapseState();return Object.prototype.hasOwnProperty.call(state,name)?!!state[name]:true}
function saveRecipientCollapsed(name,collapsed){const state=recipientCollapseState();state[name]=!!collapsed;try{localStorage.setItem(RECIPIENT_COLLAPSE_KEY,JSON.stringify(state))}catch(e){}}
function toggleRecipientGroup(btn){const group=btn.closest('.recipient-group');if(!group)return;const name=btn.dataset.recipient||'';const collapsed=!group.classList.contains('collapsed');group.classList.toggle('collapsed',collapsed);btn.setAttribute('aria-expanded',collapsed?'false':'true');saveRecipientCollapsed(name,collapsed)}
function setAllRecipientGroups(collapsed){const state=recipientCollapseState();document.querySelectorAll('.recipient-group').forEach(group=>{const btn=group.querySelector('.recipient-head'),name=btn?.dataset.recipient||'';group.classList.toggle('collapsed',collapsed);if(btn)btn.setAttribute('aria-expanded',collapsed?'false':'true');if(name)state[name]=!!collapsed});try{localStorage.setItem(RECIPIENT_COLLAPSE_KEY,JSON.stringify(state))}catch(e){}}
function expandRecipientByName(name){document.querySelectorAll('.recipient-head').forEach(btn=>{if((btn.dataset.recipient||'')===name){const group=btn.closest('.recipient-group');group?.classList.remove('collapsed');btn.setAttribute('aria-expanded','true');saveRecipientCollapsed(name,false)}})}
function setGiftViewMode(mode){giftViewMode=mode==='shop'?'shop':'recipient';localStorage.setItem('fukuokaGiftViewMode',giftViewMode);document.getElementById('giftModeRecipient')?.classList.toggle('active',giftViewMode==='recipient');document.getElementById('giftModeShop')?.classList.toggle('active',giftViewMode==='shop');document.getElementById('recipientToolbar')?.classList.toggle('hidden',giftViewMode==='shop');renderGiftMainList()}
function renderGiftMainList(){const el=document.getElementById('giftList');if(!el)return;document.getElementById('recipientToolbar')?.classList.toggle('hidden',giftViewMode==='shop');if(!giftRowsCache.length){el.innerHTML='<div class="list-empty">目前沒有伴手禮，從上方新增第一個吧。</div>';return}el.innerHTML=giftViewMode==='shop'?giftShopGroupsHTML(giftRowsCache):giftGroupsHTML(giftRowsCache)}
function giftShopGroupsHTML(rows){const filled=rows.filter(x=>(x.name||'').trim()),groups={};filled.forEach(x=>{const shop=(x.shop||x.place||'').trim()||'尚未指定店名';const key=shop+'||'+x.name.trim();if(!groups[key])groups[key]={shop,name:x.name.trim(),rows:[]};groups[key].rows.push(x)});if(!filled.length)return '<div class="list-empty">目前只有收禮人，補上「店名／品項」後就會出現購物模式。</div>';const byShop={};Object.values(groups).forEach(g=>(byShop[g.shop]||(byShop[g.shop]=[])).push(g));return Object.entries(byShop).sort((a,b)=>a[0].localeCompare(b[0],'zh-Hant')).map(([shop,items])=>`<section class="shop-group"><div class="shop-group-head"><b>🏬 ${esc(shop)}</b><small>${items.length} 種品項</small></div>${items.sort((a,b)=>a.name.localeCompare(b.name,'zh-Hant')).map(g=>{const planned=g.rows.reduce((n,x)=>n+Math.max(1,Number(x.qty)||1),0),bought=g.rows.filter(x=>x.done).reduce((n,x)=>n+Math.max(1,Number(x.qty)||1),0),remain=Math.max(0,planned-bought),recips=[...new Set(g.rows.map(x=>(x.recipient||'').trim()).filter(Boolean))];return `<div class="shop-buy-row"><div class="shop-buy-main"><b>${esc(g.name)}</b><small>送：${esc(recips.join('、')||'未指定')} · ${remain?`還差 ${remain}`:'已買齊'}</small></div><div class="shop-buy-qty"><strong>× ${planned}</strong><span>已買 ${bought}</span>${remain?`<button class="shop-buy-btn" onclick="markGiftGroupDone('${encodeURIComponent(shop)}','${encodeURIComponent(g.name)}')">✓ 全部買齊</button>`:''}</div></div>`}).join('')}</section>`).join('')}
async function markGiftGroupDone(shopEnc,nameEnc){if(!await ensureFirebase())return;const shop=decodeURIComponent(shopEnc),name=decodeURIComponent(nameEnc),rows=giftRowsCache.filter(x=>(x.name||'').trim()===name&&((x.shop||x.place||'').trim()||'尚未指定店名')===shop&&!x.done);if(!rows.length)return;const batch=sharedDb.batch();rows.forEach(x=>batch.update(giftsRef().doc(x.id),{done:true,updatedAt:firebase.firestore.FieldValue.serverTimestamp(),uid:sharedUser.uid,editorName:getEditorName()}));await batch.commit()}
function subscribeGifts(){const badge=document.getElementById('syncBadge');if(badge){badge.className='sync-badge live';badge.textContent='● 即時同步中'};const unsub=giftsRef().orderBy('createdAt','asc').onSnapshot(s=>{const el=document.getElementById('giftList');if(!el)return;giftRowsCache=s.docs.map(d=>({id:d.id,...d.data()}));renderGiftMainList();renderGiftSummary(giftRowsCache);renderGiftPurchaseTotals(giftRowsCache);renderGiftSuggestions();renderGiftPresets(giftRowsCache)},e=>console.error(e));sharedUnsubs.push(unsub)}
function giftGroupsHTML(rows){const rank={must:0,high:1,normal:2,low:3};const groups={};rows.forEach(x=>{const recipient=(x.recipient||'').trim()||'未指定對象';(groups[recipient]||(groups[recipient]=[])).push(x)});return Object.entries(groups).sort((a,b)=>a[0].localeCompare(b[0],'zh-Hant')).map(([recipient,items])=>{items.sort((a,b)=>{const an=(a.name||'').trim(),bn=(b.name||'').trim();if(!an&&bn)return 1;if(an&&!bn)return -1;const p=(rank[a.priority||'normal']??2)-(rank[b.priority||'normal']??2);return p||an.localeCompare(bn,'zh-Hant')});const filled=items.filter(x=>(x.name||'').trim()),done=filled.filter(x=>x.done).length,qty=filled.reduce((n,x)=>n+Math.max(1,Number(x.qty)||1),0),drafts=items.length-filled.length,collapsed=recipientIsCollapsed(recipient);const status=filled.length?`${done}/${filled.length} 項完成 · 預計 ${qty} 件${drafts?` · ${drafts} 筆待補資料`:''}`:`尚未填入品項 · 可稍後補資料`;return `<section class="recipient-group ${collapsed?'collapsed':''}"><button type="button" class="recipient-head" data-recipient="${esc(recipient)}" aria-expanded="${collapsed?'false':'true'}" onclick="toggleRecipientGroup(this)"><div class="recipient-head-left"><b>👤 ${esc(recipient)}</b><small>${status}</small></div><div class="recipient-head-right"><span class="recipient-count">${filled.length} 項</span><span class="recipient-chevron">⌃</span></div></button><div class="recipient-items">${items.map(giftHTML).join('')}</div></section>`}).join('')}
function renderGiftPurchaseTotals(rows){const el=document.getElementById('giftPurchaseTotals');if(!el)return;const filled=rows.filter(x=>(x.name||'').trim());if(!filled.length){el.innerHTML=rows.length?'<div class="purchase-totals-head"><div><div class="eyebrow">PURCHASE TOTAL</div><h3>🧮 要購買的品項總量</h3></div></div><div class="list-empty">已建立收禮人，等補上品項後會自動統整購買總量。</div>':'';return}const map={};let total=0,bought=0;filled.forEach(x=>{const name=x.name.trim(),qty=Math.max(1,Number(x.qty)||1);total+=qty;if(x.done)bought+=qty;if(!map[name])map[name]={name,planned:0,bought:0,shops:new Set()};map[name].planned+=qty;if(x.done)map[name].bought+=qty;const shop=(x.shop||x.place||'').trim();if(shop)map[name].shops.add(shop)});const items=Object.values(map).sort((a,b)=>(b.planned-b.bought)-(a.planned-a.bought)||b.planned-a.planned||a.name.localeCompare(b.name,'zh-Hant'));el.innerHTML=`<div class="purchase-totals-head"><div><div class="eyebrow">PURCHASE TOTAL</div><h3>🧮 要購買的品項總量</h3></div><small>相同品項自動合併</small></div><div class="purchase-total-kpis"><div><b>${total}</b><small>預計總數量</small></div><div><b>${bought}</b><small>已買數量</small></div><div><b>${Math.max(0,total-bought)}</b><small>待買數量</small></div></div><div class="purchase-item-list">${items.map(i=>{const remain=Math.max(0,i.planned-i.bought),shops=[...i.shops];return `<div class="purchase-item-row"><div><b>${esc(i.name)}</b><small>${shops.length?'店名：'+esc(shops.join('／')):'尚未指定店名'}</small></div><div class="purchase-item-qty"><strong>× ${i.planned}</strong><span>${remain?`待買 ${remain}`:'✓ 已完成'}</span></div></div>`}).join('')}</div>`}
function giftHTML(x){const name=(x.name||'').trim(),isDraft=!name,priority=x.priority||'normal',giftType=x.giftType||'split',shop=x.shop||x.place||'';if(isDraft)return `<div class="gift-item"><div style="width:21px;text-align:center;font-size:17px;margin-top:1px">📝</div><div><div class="gift-name">待補伴手禮資料</div><div class="gift-tags"><span class="gift-tag priority-normal">先建立對象</span></div><div class="gift-meta">已先建立收禮人，店名、品項、數量、預算等可以之後再補。</div><div class="gift-edit-hint">✏️ 點編輯即可補完整資料</div></div><div class="shared-actions"><button class="icon-btn" title="補資料" onclick="editGift('${x.id}')">✏️</button><button class="icon-btn" title="刪除" onclick="deleteGift('${x.id}')">🗑️</button></div></div>`;const meta=[shop?`店名：${esc(shop)}`:'',`數量 ${Math.max(1,Number(x.qty)||1)}`,x.budget?`單件預算 ¥${Number(x.budget).toLocaleString()}`:'',x.note?esc(x.note):''].filter(Boolean).join(' · ');return `<div class="gift-item ${x.done?'done':''}"><input type="checkbox" ${x.done?'checked':''} onchange="toggleGift('${x.id}',this.checked)"><div><div class="gift-name">${esc(name)}</div><div class="gift-tags"><span class="gift-tag priority-${priority}">${priorityLabel(priority)}</span><span class="gift-tag type">${giftTypeLabel(giftType)}</span></div><div class="gift-meta">${meta||'尚未填寫購買資訊'}</div><div class="gift-edit-hint">${x.editorName?`最後修改：<span class="editor-name">${esc(x.editorName)}</span>${timestampText(x.updatedAt)?' · '+timestampText(x.updatedAt):''} · `:''}✏️ 編輯會把這筆資料完整帶回上方表單</div></div><div class="shared-actions"><button class="icon-btn" title="帶入編輯" onclick="editGift('${x.id}')">✏️</button><button class="icon-btn" title="刪除" onclick="deleteGift('${x.id}')">🗑️</button></div></div>`}
function renderGiftSummary(rows){const el=document.getElementById('giftSummary');if(!el)return;const recipients=new Set(rows.map(x=>(x.recipient||'').trim()).filter(Boolean)),filled=rows.filter(x=>(x.name||'').trim()),done=filled.filter(x=>x.done).length,budget=filled.reduce((a,x)=>a+(Number(x.budget)||0)*Math.max(1,Number(x.qty)||1),0);el.innerHTML=`<div><b>${recipients.size}</b><small>收禮人</small></div><div><b>${filled.length}</b><small>已填品項</small></div><div><b>¥${budget.toLocaleString()}</b><small>估計預算</small></div>`}

function isStandalonePWA(){return window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true}
function pwaNetworkText(){return navigator.onLine?'目前有網路，可即時同步 Firebase':'目前離線，已開過的行程仍可閱讀；共編資料會在可用時同步'}
function pwaCardHTML(){const installed=isStandalonePWA();return `<section class="section"><div class="section-head"><div><div class="eyebrow">PWA</div><h2>安裝與離線</h2></div></div><div class="pwa-install-card"><div class="pwa-install-top"><img class="pwa-app-icon" src="./icons/icon-192.png" alt="福岡親子旅 App 圖示"><div class="pwa-install-copy"><b>${installed?'已用 App 模式開啟':'福岡親子旅 PWA'}</b><small>${installed?'目前是獨立 App 視窗，可直接從桌面開啟。':'可安裝到 Android / 電腦桌面，不影響原本網址與 Firebase 共編。'}</small></div></div><div class="pwa-badges"><span class="pwa-badge ${navigator.onLine?'online':'offline'}">${navigator.onLine?'● 線上':'○ 離線'}</span><span class="pwa-badge ${installed?'installed':''}">${installed?'✓ 已安裝':'📲 可安裝'}</span><span class="pwa-badge">💾 行程離線快取</span></div><button id="pwaInstallButton" class="pwa-install-btn" type="button" onclick="installPWA()" ${installed?'disabled':''}>${installed?'✓ 已安裝到裝置':'📲 安裝「福岡親子旅」'}</button><div class="pwa-offline-note"><b>離線模式：</b>${pwaNetworkText()}。景點外部照片首次看過後會盡量保留快取；即時天氣、導航與第一次 Firebase 登入仍需要網路。</div></div></section>`}
async function installPWA(){
 if(isStandalonePWA())return;
 if(deferredInstallPrompt){
  deferredInstallPrompt.prompt();
  try{await deferredInstallPrompt.userChoice}catch(e){}
  deferredInstallPrompt=null;
  refreshPWAView();
  return;
 }
 alert('若瀏覽器沒有直接跳出安裝視窗：Android Chrome 請點右上角 ⋮ →「安裝應用程式」或「加到主畫面」；電腦 Chrome / Edge 可使用網址列旁的安裝圖示。');
}
function refreshPWAView(){if(currentPage==='more'&&document.getElementById('content'))morePage()}
function showNetworkToast(text){let el=document.getElementById('pwaNetworkToast');if(!el){el=document.createElement('div');el.id='pwaNetworkToast';el.className='pwa-network-toast';document.body.appendChild(el)}el.textContent=text;el.classList.add('show');clearTimeout(showNetworkToast.t);showNetworkToast.t=setTimeout(()=>el.classList.remove('show'),2400)}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e;refreshPWAView()});
window.addEventListener('appinstalled',()=>{deferredInstallPrompt=null;showNetworkToast('✓ 福岡親子旅已安裝');refreshPWAView()});
window.addEventListener('online',()=>{showNetworkToast('● 已恢復網路連線');refreshPWAView()});
window.addEventListener('offline',()=>{showNetworkToast('○ 目前離線，使用快取內容');refreshPWAView()});
async function registerPWA(){
 if(!('serviceWorker' in navigator))return;
 try{
  const reg=await navigator.serviceWorker.register('./sw.js',{scope:'./'});
  setTimeout(()=>reg.update().catch(()=>{}),3000);
  console.log('PWA service worker ready',reg.scope);
 }catch(e){console.warn('PWA service worker registration failed',e)}
}
window.addEventListener('load',registerPWA);


const SECURE_DRIVE_FOLDER_KEY='fukuokaSecureDriveFolderV45';
const SECURE_SHORTCUTS_KEY='fukuokaSecureShortcutsV45';
let secureEditingId=null;
const SECURE_CATEGORIES=[
 {id:'passport',label:'🛂 護照影本'},
 {id:'visit',label:'🇯🇵 Visit Japan'},
 {id:'flight',label:'✈️ 航班文件'},
 {id:'hotel',label:'🏨 訂房文件'},
 {id:'medical',label:'🩺 醫療文件'},
 {id:'other',label:'📄 其他資料'}
];
function secureCategoryLabel(id){return (SECURE_CATEGORIES.find(x=>x.id===id)||SECURE_CATEGORIES.at(-1)).label}
function safeDriveURL(raw){try{const u=new URL(String(raw||'').trim());const ok=['drive.google.com','docs.google.com'].includes(u.hostname);return ok?u.href:''}catch(e){return ''}}
function driveFileId(url){const s=String(url||'');return s.match(/\/file\/d\/([a-zA-Z0-9_-]+)/)?.[1]||s.match(/[?&]id=([a-zA-Z0-9_-]+)/)?.[1]||''}
function driveDownloadURL(url){const id=driveFileId(url);return id?`https://drive.google.com/uc?export=download&id=${encodeURIComponent(id)}`:''}
function loadSecureShortcuts(){try{const a=JSON.parse(localStorage.getItem(SECURE_SHORTCUTS_KEY)||'[]');return Array.isArray(a)?a:[]}catch(e){return []}}
function saveSecureShortcuts(rows){localStorage.setItem(SECURE_SHORTCUTS_KEY,JSON.stringify(rows))}
function secureFolderURL(){return safeDriveURL(localStorage.getItem(SECURE_DRIVE_FOLDER_KEY)||'')}
function saveSecureFolder(){const input=document.getElementById('secureFolderInput'),raw=input?.value.trim()||'';if(!raw){localStorage.removeItem(SECURE_DRIVE_FOLDER_KEY);renderSecureFolder();return}const url=safeDriveURL(raw);if(!url)return alert('請貼上 Google Drive / Google Docs 的私人資料夾網址');localStorage.setItem(SECURE_DRIVE_FOLDER_KEY,url);renderSecureFolder();showNetworkToast('✓ Drive 資料夾捷徑已儲存於這台裝置')}
function renderSecureFolder(){const el=document.getElementById('secureFolderBox');if(!el)return;const url=secureFolderURL();el.innerHTML=`<div class="drive-folder-card"><h3>📁 私人 Google Drive 資料夾</h3><p>建議在 Drive 建立「福岡重要資料」資料夾，分享設定保持 <b>受限制</b>，只加入同行家人的 Google 帳號。</p><div class="drive-folder-row"><input id="secureFolderInput" value="${esc(url)}" placeholder="貼上 Google Drive 私人資料夾網址"><button onclick="saveSecureFolder()">儲存</button></div><div class="drive-folder-actions">${url?`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">📂 開啟私人 Drive</a><button onclick="localStorage.removeItem(SECURE_DRIVE_FOLDER_KEY);renderSecureFolder()">清除捷徑</button>`:'<span class="login-mini">網址只會儲存在這台裝置，不會上傳 Firebase。</span>'}</div></div>`}
function secureFormHTML(){return `<form id="secureShortcutForm" class="secure-form" onsubmit="saveSecureShortcut(event)"><div class="secure-form-grid"><select id="secureCategory">${SECURE_CATEGORIES.map(x=>`<option value="${x.id}">${x.label}</option>`).join('')}</select><input id="secureTitle" maxlength="50" placeholder="名稱，例如：爸爸護照影本" required></div><input id="secureURL" type="url" inputmode="url" placeholder="Google Drive 檔案分享網址" required><textarea id="secureNote" maxlength="100" placeholder="備註，例如：效期 / Visit Japan 入境 QR"></textarea><div class="secure-form-actions"><button id="secureSubmitBtn" type="submit">＋ 新增私人捷徑</button><button id="secureCancelBtn" type="button" class="secondary hidden" onclick="resetSecureForm()">取消編輯</button></div></form>`}
function saveSecureShortcut(e){e.preventDefault();if(!authUserOK())return alert('請先使用 Google 登入');const title=document.getElementById('secureTitle').value.trim(),url=safeDriveURL(document.getElementById('secureURL').value),category=document.getElementById('secureCategory').value,note=document.getElementById('secureNote').value.trim();if(!title)return;if(!url)return alert('只接受 Google Drive / Google Docs 網址');let rows=loadSecureShortcuts();if(secureEditingId){rows=rows.map(x=>x.id===secureEditingId?{...x,title,url,category,note}:x)}else{rows.push({id:(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)),title,url,category,note})}saveSecureShortcuts(rows);resetSecureForm();renderSecureShortcuts()}
function editSecureShortcut(id){const x=loadSecureShortcuts().find(r=>r.id===id);if(!x)return;secureEditingId=id;document.getElementById('secureCategory').value=x.category||'other';document.getElementById('secureTitle').value=x.title||'';document.getElementById('secureURL').value=x.url||'';document.getElementById('secureNote').value=x.note||'';document.getElementById('secureSubmitBtn').textContent='✓ 儲存修改';document.getElementById('secureCancelBtn').classList.remove('hidden');document.getElementById('secureShortcutForm').scrollIntoView({behavior:'smooth',block:'center'})}
function resetSecureForm(){secureEditingId=null;document.getElementById('secureShortcutForm')?.reset();const b=document.getElementById('secureSubmitBtn'),c=document.getElementById('secureCancelBtn');if(b)b.textContent='＋ 新增私人捷徑';if(c)c.classList.add('hidden')}
function deleteSecureShortcut(id){if(!confirm('刪除這台裝置上的重要資料捷徑？\nGoogle Drive 原始檔案不會被刪除。'))return;saveSecureShortcuts(loadSecureShortcuts().filter(x=>x.id!==id));renderSecureShortcuts()}
function renderSecureShortcuts(){const el=document.getElementById('secureShortcutList');if(!el)return;const rows=loadSecureShortcuts();if(!rows.length){el.innerHTML='<div class="list-empty">尚未建立捷徑。可以新增護照影本、Visit Japan 截圖、電子機票等 Google Drive 私人連結。</div>';return}const groups={};rows.forEach(x=>(groups[x.category||'other']||(groups[x.category||'other']=[])).push(x));el.innerHTML=SECURE_CATEGORIES.filter(c=>groups[c.id]?.length).map(c=>`<section class="secure-group"><div class="secure-group-head"><b>${c.label}</b><small>${groups[c.id].length} 筆</small></div>${groups[c.id].map(x=>{const dl=driveDownloadURL(x.url);return `<div class="secure-link"><div><b>${esc(x.title)}</b><small>${x.note?esc(x.note):'Google Drive 私人文件'}</small></div><div class="secure-link-actions"><a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">開啟</a>${dl?`<a class="download" href="${esc(dl)}" target="_blank" rel="noopener noreferrer">下載</a>`:''}<button class="edit" onclick="editSecureShortcut('${x.id}')">編輯</button><button class="delete" onclick="deleteSecureShortcut('${x.id}')">刪除</button></div></div>`}).join('')}</section>`).join('')}
async function securePage(){clearSharedListeners();await initFirebase();if(!authUserOK()){content.innerHTML=`<section class="section"><div class="secure-hero"><div class="secure-ico">🔐</div><h2>重要資料</h2><p>護照影本、Visit Japan、電子機票與醫療文件都留在私人 Google Drive；這個 PWA 只提供安全捷徑。</p></div>${authSetupWarning()}${authGateHTML('重要資料')}</section>`;return}content.innerHTML=`<section class="section"><div class="secure-hero"><div class="secure-ico">🔐</div><h2>重要資料</h2><p>真正的文件仍存放在 Google Drive。PWA 不保存護照影本、不預覽敏感圖片，也不把 Drive 文件加入 Service Worker 快取。</p><div class="secure-badges"><span>✓ Google 已登入</span><span>🔒 Drive 權限保護</span><span>🚫 不快取文件</span></div></div>${authSetupWarning()}${authAccountHTML()}<div class="secure-local-note"><b>隱私設計：</b>下方 Drive 資料夾網址與文件捷徑只存在目前裝置的 localStorage，不會同步到 Firebase。若換手機，只要重新貼一次 Drive 私人資料夾與常用檔案連結。</div><div id="secureFolderBox"></div>${secureFormHTML()}<div class="section-head"><div><div class="eyebrow">PRIVATE SHORTCUTS</div><h2>重要文件捷徑</h2></div></div><div id="secureShortcutList" class="secure-list"></div></section>`;renderSecureFolder();renderSecureShortcuts()}

async function morePage(){await initFirebase();const name=getEditorName();content.innerHTML=`<section class="section"><div class="section-head"><div><div class="eyebrow">ACCOUNT</div><h2>Google 家人帳號</h2></div></div>${authSetupWarning()}${authAccountHTML()}${authUserOK()?`<div class="editor-card"><b style="font-size:15px;color:#6f5347">✏️ 共同編輯顯示名稱</b><div class="editor-current" id="editorNameStatus">預設使用 Google 顯示名稱；需要的話可在這台裝置自訂暱稱。</div><div class="editor-row"><input id="editorNameInput" maxlength="24" value="${esc(localStorage.getItem('fukuokaEditorName')||'')}" placeholder="留空＝使用 Google 顯示名稱"><button onclick="saveEditorName()">儲存</button></div></div>`:''}</section>${pwaCardHTML()}<section class="section"><div class="section-head"><h2>旅程重要資訊</h2></div><div class="more-grid"><button class="more-card secure-card" onclick="setPage('secure')" style="text-align:left"><span class="ico">🔐</span><b>重要資料</b><small>護照 / Visit Japan / Drive</small></button><a class="more-card" href="${HOTEL_MAPS}" target="_blank"><span class="ico">🏨</span><b>住宿飯店</b><small>Quintessa 天神南</small></a><a class="more-card" href="https://www.google.com/maps/search/?api=1&query=Fukuoka+Airport+International+Terminal" target="_blank"><span class="ico">✈️</span><b>福岡機場</b><small>國際線航廈</small></a><button class="more-card" onclick="openTripDay(4)" style="text-align:left"><span class="ico">🌦️</span><b>Day 4 晴雨切換</b><small>依當天天氣決定</small></button><a class="more-card" href="${UBER_ANDROID_LINK}"><span class="ico">🚕</span><b>Uber</b><small>Android 直接開 App</small></a></div></section><section class="section"><div class="section-head"><h2>出發前重要事項</h2></div><div class="card pad"><span class="pill red">🤰 MEDIF</span><h3 style="margin:10px 0 8px;font-size:16px">9/6（日）產檢＋醫師開立文件</h3><div class="notice danger">MEDIF、診斷證明、媽媽手冊放隨身；完成後確認 BR106 與 BR105 兩航段。</div></div></section><section class="section"><div class="section-head"><h2>緊急聯絡</h2></div><div class="card pad"><div style="display:grid;gap:8px"><a class="quick" href="tel:119"><b>🚑 119</b><small>救護車／消防</small></a><a class="quick" href="tel:110"><b>👮 110</b><small>警察</small></a><a class="quick" href="tel:+815038162787"><b>☎️ JNTO 050-3816-2787</b><small>外國旅客熱線</small></a></div></div></section>`}
function setPage(day,scroll=true){currentPage=String(day);document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.day===String(day)));clearSharedListeners();if(day==='home')home();else if(day==='trip')tripHubPage();else if(day==='checklist')checklistPage();else if(day==='gifts')giftsPage();else if(day==='more')morePage();else if(day==='secure')securePage();else{selectedTripDay=Number(day)||selectedTripDay;currentPage='trip';dayPage(selectedTripDay)}if(scroll)window.scrollTo({top:0,behavior:'smooth'})}
function markTodayNav(){const td=tripDayToday();document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('today',!!td&&b.dataset.day==='trip'))}
function updateCountdown(){const now=new Date(),start=new Date('2026-09-09T04:30:00+08:00'),end=new Date('2026-09-13T13:45:00+08:00');let txt='';if(now<start){const d=Math.ceil((start-now)/86400000);txt=`距離出發約 ${d} 天｜9/6 產檢＋MEDIF`}else if(now>end){txt='旅程已完成，這份頁面就是我們的福岡旅行紀錄 ✨'}else{const td=tripDayToday();txt=td?`旅行進行中｜今天是 Day ${td}，只完成主任務也很棒 👍`:'旅行進行中｜慢慢走、休息優先'}document.getElementById('countdown').textContent=txt}
function openPhoto(src,alt){const m=document.getElementById('photoModal'),im=document.getElementById('modalImage');im.src=src;im.alt=alt||'照片';m.classList.add('show');document.body.style.overflow='hidden'}
function closePhoto(e){if(e&&e.target.id==='modalImage')return;document.getElementById('photoModal').classList.remove('show');document.body.style.overflow=''}
document.querySelectorAll('.nav-btn').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.day)));
try{initFirebase();updateCountdown();markTodayNav();const launchPage=new URLSearchParams(location.search).get('page');const allowedLaunchPages=new Set(['home','trip','checklist','gifts','more','secure']);setPage(allowedLaunchPages.has(launchPage)?launchPage:'home',false);loadFukuokaWeather();setInterval(()=>{updateCountdown();markTodayNav();if(currentPage==='home')home();else if(currentPage==='trip'&&tripDayToday()===selectedTripDay)dayPage(selectedTripDay)},60000)}catch(err){console.error(err);content.innerHTML='<div class="notice danger">頁面載入失敗，請重新整理或重新上傳最新版 index.html。</div>'}
</script>
